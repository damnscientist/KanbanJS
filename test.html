<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KanbanJS — Tests</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1410;color:#e0d8d0;padding:40px;max-width:800px;margin:0 auto}
  h1{font-size:20px;color:#e8a85a;margin-bottom:8px}
  .sub{font-size:12px;color:#8a8278;margin-bottom:24px}
  .test{padding:10px 14px;margin-bottom:6px;border-radius:6px;font-size:13px;font-family:'Cascadia Code','Fira Code',monospace}
  .pass{background:#1a2e1a;color:#5ecf9a}
  .fail{background:#2e1a1a;color:#e87a6a}
  .fail .detail{display:block;color:#8a8278;font-size:11px;margin-top:4px}
  .summary{padding:14px;margin-top:20px;border-radius:6px;font-size:14px;font-weight:600}
  .summary.good{background:#1a2e1a;color:#5ecf9a}
  .summary.bad{background:#2e1a1a;color:#e87a6a}
  #status{font-size:12px;color:#8a8278;margin-bottom:12px}
  iframe{display:none}
</style>
</head>
<body>
<h1>KanbanJS — Tests de non-régression</h1>
<div class="sub">Ouvre index.html en iframe et teste les opérations DB + export/import.</div>
<div id="status">Chargement de l'iframe…</div>
<iframe id="frame" src="index.html?test"></iframe>
<div id="results"></div>

<script>
const frame = document.getElementById('frame');
const resultsEl = document.getElementById('results');
const statusEl = document.getElementById('status');
let pass = 0, fail = 0, pending = 0;

function send(method, args = {}, timeout = 4000) {
  pending++;
  const msgId = crypto.randomUUID ? crypto.randomUUID() : 't' + Math.random().toString(36).slice(2);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pending--;
      reject(new Error('Timeout (' + method + ')'));
    }, timeout);
    const handler = (e) => {
      if (e.data && e.data.msgId === msgId) {
        window.removeEventListener('message', handler);
        clearTimeout(timer);
        pending--;
        if (e.data.error) reject(new Error(e.data.error));
        else resolve(e.data.result);
      }
    };
    window.addEventListener('message', handler);
    frame.contentWindow.postMessage({ msgId, method, ...args }, '*');
  });
}

function assert(label, condition, detail) {
  const el = document.createElement('div');
  if (condition) {
    el.className = 'test pass';
    el.textContent = '\u2713 ' + label;
    pass++;
  } else {
    el.className = 'test fail';
    el.textContent = '\u2717 ' + label;
    if (detail) {
      const d = document.createElement('span');
      d.className = 'detail';
      d.textContent = typeof detail === 'string' ? detail : JSON.stringify(detail);
      el.appendChild(d);
    }
    fail++;
  }
  resultsEl.appendChild(el);
}

async function run() {
  statusEl.textContent = 'Attente de l\'initialisation…';
  await new Promise(r => setTimeout(r, 800));

  statusEl.textContent = 'Exécution des tests…';

  // Nettoyage localStorage avant les tests (depuis le scope parent qui partage l'origine)
  // On ne peut pas accéder au localStorage de l'iframe directement, on utilise reset

  // ── 0. Reset ────────────────────────────────────────────────
  try {
    await send('reset');
    await send('rebuild');
    await new Promise(r => setTimeout(r, 200));
    assert('Reset — le board est restauré', true);
  } catch (e) {
    assert('Reset — le board est restauré', false, e.message);
  }

  // ── 1. Listes par défaut ────────────────────────────────────
  try {
    const lists = await send('getLists');
    assert('6 listes après reset', lists.length === 6, 'trouvé : ' + lists.length);
    assert('Liste "Tuto" en position 0', lists[0] && lists[0].title === 'Tuto', lists[0]?.title);
    assert('Liste "Done" marquée terminée', lists.some(l => l.title === 'Done' && l.done), 'done=' + lists.find(l => l.title === 'Done')?.done);
  } catch (e) {
    assert('Listes par défaut', false, e.message);
  }

  // ── 2. Création de carte ────────────────────────────────────
  let testCard;
  try {
    const lists = await send('getLists');
    const backlog = lists.find(l => l.title === 'Backlog');
    assert('Backlog trouvé', !!backlog);
    if (backlog) {
      testCard = await send('createCard', { listId: backlog.id, text: 'Carte de test' });
      assert('Carte créée', !!testCard && testCard.text === 'Carte de test');
      assert('Carte a un id', !!testCard && typeof testCard.id === 'string' && testCard.id.startsWith('_'));
      assert('Carte a notes vide', testCard && testCard.notes === '');
      assert('Carte a doneAt null', testCard && testCard.doneAt === null);
    }
  } catch (e) {
    assert('Création de carte', false, e.message);
  }

  // ── 3. Création d'une liste ─────────────────────────────────
  let testList;
  try {
    testList = await send('createList', { title: 'Liste de test' });
    assert('Liste créée', !!testList && testList.title === 'Liste de test');
    assert('Liste a un id', !!testList && typeof testList.id === 'string');
    const lists = await send('getLists');
    assert('7 listes après ajout', lists.length === 7, 'trouvé : ' + lists.length);
  } catch (e) {
    assert('Création de liste', false, e.message);
  }

  // ── 4. Suppression de carte ─────────────────────────────────
  try {
    if (testCard) {
      await send('deleteCard', { id: testCard.id });
      const cards = await send('getCards', { listId: testCard.listId });
      assert('Carte supprimée', !cards.some(c => c.id === testCard.id));
    } else {
      assert('Carte supprimée', false, 'pas de carte à supprimer');
    }
  } catch (e) {
    assert('Suppression de carte', false, e.message);
  }

  // ── 5. Suppression de liste ─────────────────────────────────
  try {
    if (testList) {
      await send('deleteList', { id: testList.id });
      const lists = await send('getLists');
      assert('Liste supprimée', !lists.some(l => l.id === testList.id));
      assert('Retour à 6 listes', lists.length === 6, 'trouvé : ' + lists.length);
    }
  } catch (e) {
    assert('Suppression de liste', false, e.message);
  }

  // ── 6. Export / Import ──────────────────────────────────────
  try {
    const exported = await send('export');
    const parsed = JSON.parse(exported);
    assert('Export contient state', !!parsed.state);
    assert('Export contient board', !!parsed.state.board);
    assert('Export contient lists', Array.isArray(parsed.state.lists));
    assert('Export contient cards', Array.isArray(parsed.state.cards));
    assert('Export contient streak', 'streak' in parsed);

    // Créer une carte pour différencier, puis importer l'ancien export
    const lists = await send('getLists');
    const backlog = lists.find(l => l.title === 'Backlog');
    await send('createCard', { listId: backlog.id, text: 'Carte temporaire' });
    let cards = await send('getBoardCards');
    const countAfter = cards.length;

    await send('import', { json: exported });
    await send('rebuild');
    await new Promise(r => setTimeout(r, 200));
    cards = await send('getBoardCards');
    assert('Import restaure le nombre de cartes', cards.length === countAfter - 1,
      'avant import: ' + countAfter + ', après: ' + cards.length);
  } catch (e) {
    assert('Export / Import', false, e.message);
  }

  // ── 7. Streak ───────────────────────────────────────────────
  try {
    await send('setStreak', { streak: 5, lastDate: '2026-06-30', todayCount: 3, todayDate: '2026-06-30' });
    const s = await send('getStreak');
    assert('Streak écrit/lu', s.streak === 5 && s.lastDate === '2026-06-30');
    assert('Streak todayCount', s.todayCount === 3);

    await send('setStreak', { streak: 0, lastDate: null, todayCount: 0, todayDate: null });
    const s2 = await send('getStreak');
    assert('Streak reset', s2.streak === 0);
  } catch (e) {
    assert('Streak', false, e.message);
  }

  // ── 8. Board name ───────────────────────────────────────────
  try {
    const board = await send('getBoard');
    assert('Board a un nom', !!board && board.name.length > 0);
  } catch (e) {
    assert('Board name', false, e.message);
  }

  // ── 9. Compteurs ────────────────────────────────────────────
  try {
    const cardCount = await send('cardCount');
    const listCount = await send('listCount');
    assert('cardCount > 0', cardCount > 0, 'trouvé : ' + cardCount);
    assert('listCount = 6', listCount === 6, 'trouvé : ' + listCount);
  } catch (e) {
    assert('Compteurs', false, e.message);
  }

  // ── 10. dateKey locale (pas UTC) ────────────────────────────
  try {
    const late = await send('dateKey', { date: new Date(2026, 5, 30, 23, 30).toISOString() });
    assert('dateKey à 23h30 locale = jour local', late === '2026-06-30', 'trouvé : ' + late);

    const early = await send('dateKey', { date: new Date(2026, 5, 30, 0, 30).toISOString() });
    assert('dateKey à 0h30 locale = jour local', early === '2026-06-30', 'trouvé : ' + early);

    const midnight = await send('dateKey', { date: new Date(2026, 0, 1, 0, 0).toISOString() });
    assert('dateKey au 1er janvier', midnight === '2026-01-01', 'trouvé : ' + midnight);
  } catch (e) {
    assert('dateKey locale', false, e.message);
  }

  // ── 11. Self-heal (copie de secours) ────────────────────────
  try {
    await send('renameBoard', { name: 'SelfHeal-A' });
    await send('renameBoard', { name: 'SelfHeal-B' });
    await send('corruptState');
    await send('reload');
    const board = await send('getBoard');
    assert('Self-heal — board restauré depuis la copie de secours', board.name === 'SelfHeal-A',
      'trouvé : ' + board.name);
    const lists = await send('getLists');
    assert('Self-heal — listes intactes', lists.length === 6, 'trouvé : ' + lists.length);
  } catch (e) {
    assert('Self-heal', false, e.message);
  }

  // ── 12. Reset purge la copie de secours ─────────────────────
  try {
    await send('reset');
    const bak = await send('getBackup');
    assert('Reset purge la copie de secours', bak === null, 'trouvé : ' + bak);
  } catch (e) {
    assert('Reset purge la copie de secours', false, e.message);
  }

  // ── 13. Copie de secours corrompue re-semée au load ─────────
  try {
    await send('corruptBackup');
    await send('reload');
    const raw = await send('getBackup');
    let valid = false;
    try { valid = !!JSON.parse(raw).board; } catch (_) {}
    assert('Copie de secours corrompue re-semée', valid, 'trouvé : ' + raw);
  } catch (e) {
    assert('Copie de secours corrompue re-semée', false, e.message);
  }

  // ── 14. Fichier compagnon — écriture automatique ────────────
  try {
    await send('autoSaveMock', { mode: 'granted' });
    const lists = await send('getLists');
    const backlog = lists.find(l => l.title === 'Backlog');
    await send('createCard', { listId: backlog.id, text: 'Carte compagnon' });
    await new Promise(r => setTimeout(r, 1200));
    const raw = await send('autoSaveFile');
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch (_) {}
    assert('Écriture automatique différée dans le fichier',
      !!parsed && parsed.state.cards.some(c => c.text === 'Carte compagnon'),
      'raw = ' + String(raw).slice(0, 80));
    assert('Fichier compagnon inclut le streak', !!parsed && 'streak' in parsed);
    assert('Fichier compagnon exclut la clé API', !!raw && raw.indexOf('apiKey') === -1);
  } catch (e) {
    assert('Fichier compagnon — écriture automatique', false, e.message);
  }

  // ── 15. Fichier compagnon — restauration après perte ────────
  try {
    await send('autoSaveMock', { mode: 'granted' });
    const lists = await send('getLists');
    const backlog = lists.find(l => l.title === 'Backlog');
    await send('createCard', { listId: backlog.id, text: 'Carte à retrouver' });
    await send('autoSaveFlush');

    await send('corruptState');
    await send('corruptBackup');
    await send('reload');
    const src = await send('loadSource');
    assert('Perte de données détectée', src === 'default', 'source = ' + src);

    const ok = await send('autoSaveRestore');
    const cards = await send('getBoardCards');
    assert('Restauration depuis le fichier compagnon',
      ok === true && cards.some(c => c.text === 'Carte à retrouver'), 'ok = ' + ok);
  } catch (e) {
    assert('Fichier compagnon — restauration', false, e.message);
  }

  // ── 16. Fichier compagnon — permission requise ──────────────
  try {
    await send('autoSaveMock', { mode: 'prompt' });
    const st = await send('autoSaveState');
    assert('Permission en attente → sauvegarde en pause', st === 'paused', 'état = ' + st);
    const ok = await send('autoSaveFlush');
    assert('Aucune écriture sans permission', ok === false, 'flush = ' + ok);
    await send('autoSaveDisable');
    const st2 = await send('autoSaveState');
    assert('Désactivation → sauvegarde inactive', st2 === 'idle', 'état = ' + st2);
  } catch (e) {
    assert('Fichier compagnon — permission', false, e.message);
  }

  // ── 17. Fichier compagnon — aucune écriture tant qu'une décision est en attente ──
  try {
    await send('autoSaveMock', { mode: 'granted' });
    const payload = JSON.parse(await send('export'));
    payload.state.board.name = 'Version externe';
    await send('autoSaveSetFile', { text: JSON.stringify(payload), modified: Date.now() + 60000 });
    const resumed = await send('autoSaveResume');
    assert('Fichier externe plus récent détecté', resumed === true, 'resume = ' + resumed);

    const before = await send('autoSaveFile');
    const lists = await send('getLists');
    const backlog = lists.find(l => l.title === 'Backlog');
    await send('createCard', { listId: backlog.id, text: 'NE-DOIT-PAS-ETRE-ECRIT' });
    await new Promise(r => setTimeout(r, 1200));
    const after = await send('autoSaveFile');
    assert('Aucune écriture tant que la décision est en attente', after === before,
      'le fichier a été écrasé');

    await send('autoSaveDismiss');
    await send('autoSaveFlush');
    const afterDismiss = await send('autoSaveFile');
    assert('Écriture reprise après décision',
      afterDismiss !== before && afterDismiss.indexOf('NE-DOIT-PAS-ETRE-ECRIT') !== -1);
  } catch (e) {
    assert('Fichier compagnon — écriture bloquée', false, e.message);
  }

  // ── 18. Fichier compagnon — un fichier invalide n'est jamais armé ──
  try {
    await send('autoSaveMock', { mode: 'granted' });
    const ok = await send('autoSaveAttachWith', { text: 'PAS-DU-JSON' });
    assert('Attach d\'un fichier invalide refusé', ok === false, 'ok = ' + ok);

    const lists = await send('getLists');
    const backlog = lists.find(l => l.title === 'Backlog');
    await send('createCard', { listId: backlog.id, text: 'Carte après échec' });
    await new Promise(r => setTimeout(r, 1200));
    const bad = await send('autoSaveBadFile');
    assert('Le fichier refusé n\'est pas écrasé', bad === 'PAS-DU-JSON', 'contenu = ' + bad);
  } catch (e) {
    assert('Fichier compagnon — fichier invalide', false, e.message);
  }

  // ── 19. Fichier compagnon — écriture concurrente non perdue ──
  try {
    await send('autoSaveMock', { mode: 'slow' });
    const lists = await send('getLists');
    const backlog = lists.find(l => l.title === 'Backlog');
    await send('createCard', { listId: backlog.id, text: 'ECRITURE-V1' });
    await new Promise(r => setTimeout(r, 900));
    await send('createCard', { listId: backlog.id, text: 'ECRITURE-V2' });
    await new Promise(r => setTimeout(r, 3200));
    const raw = await send('autoSaveFile');
    assert('Écriture concurrente non perdue', raw.indexOf('ECRITURE-V2') !== -1,
      'V2 absente du fichier');
  } catch (e) {
    assert('Fichier compagnon — écriture concurrente', false, e.message);
  }

  // ── 20. Fichier compagnon — désactivation pendant une écriture ──
  try {
    await send('autoSaveMock', { mode: 'slow' });
    await send('autoSaveFlushAsync');
    await send('autoSaveDisable');
    await new Promise(r => setTimeout(r, 2200));
    const st = await send('autoSaveState');
    const name = await send('autoSaveFileName');
    assert('Désactivation pendant une écriture → inactive', st === 'idle', 'état = ' + st);
    assert('Aucun fichier conservé après désactivation', name === '', 'fichier = ' + name);
  } catch (e) {
    assert('Fichier compagnon — désactivation', false, e.message);
  }

  // ── 21. Repli export — sonde de capacité et rappel ──────────
  try {
    const cap = await send('autoSaveCapability');
    assert('Sonde de capacité : valeur connue',
      ['ok', 'insecure', 'no-picker', 'no-idb'].includes(cap), 'capacité = ' + cap);

    const keyOf = async offset => {
      const d = new Date();
      d.setDate(d.getDate() - offset);
      return send('dateKey', { date: d.toISOString() });
    };
    const today = await keyOf(0);
    const d10 = await keyOf(10), d6 = await keyOf(6), d3 = await keyOf(3), d2 = await keyOf(2);

    assert('Rappel dû après 7 jours sans export',
      (await send('backupDue', { info: { firstSeen: d10, lastExport: null }, today })) === true);
    assert('Rappel non dû si export récent',
      (await send('backupDue', { info: { firstSeen: d10, lastExport: d3 }, today })) === false);
    assert('Rappel non dû si installation récente',
      (await send('backupDue', { info: { firstSeen: d2, lastExport: null }, today })) === false);
    assert('Rappel non dû la veille du seuil',
      (await send('backupDue', { info: { firstSeen: d6, lastExport: null }, today })) === false);

    const mBrave = await send('autosaveMessage', { cap: 'no-picker', brave: true });
    assert('Message ciblé pour Brave', mBrave.indexOf('brave://flags') !== -1, mBrave);
    const mInsecure = await send('autosaveMessage', { cap: 'insecure', brave: false });
    assert('Message ciblé pour contexte non sécurisé', mInsecure.indexOf('HTTPS') !== -1, mInsecure);
    const mIdb = await send('autosaveMessage', { cap: 'no-idb', brave: false });
    assert('Message ciblé pour IndexedDB désactivé', mIdb.indexOf('IndexedDB') !== -1, mIdb);

    await send('setBackupInfo', { info: { firstSeen: '2026-01-01', lastExport: '2026-02-01' } });
    const bi = await send('backupInfo');
    assert('Infos de sauvegarde persistées',
      bi.firstSeen === '2026-01-01' && bi.lastExport === '2026-02-01',
      JSON.stringify(bi));
    assert('hasState vrai après une mutation', (await send('hasState')) === true);
  } catch (e) {
    assert('Repli export — rappel', false, e.message);
  }

  // ── 22. Ordre des cartes conservé après rebuild et reload ────
  try {
    await send('reset');
    await send('rebuild');
    const lists = await send('getLists');
    const tuto = lists.find(l => l.title === 'Tuto');
    const before = await send('domCardOrder', { listId: tuto.id });
    const expected = before.slice(1).concat(before[0]);
    const cards = await send('getCards', { listId: tuto.id });
    await send('moveCard', { cardId: cards[0].id, toListId: tuto.id, newPos: cards.length - 1 });
    await send('rebuild');
    const after = await send('domCardOrder', { listId: tuto.id });
    assert('Ordre des cartes conservé après rebuild',
      JSON.stringify(after) === JSON.stringify(expected), JSON.stringify(after));

    await send('reload');
    await send('rebuild');
    const afterReload = await send('domCardOrder', { listId: tuto.id });
    assert('Ordre des cartes conservé après reload',
      JSON.stringify(afterReload) === JSON.stringify(expected), JSON.stringify(afterReload));
  } catch (e) {
    assert('Ordre des cartes', false, e.message);
  }

  // ── 23. Les deux clés corrompues → copie de secours réparée ──
  try {
    await send('corruptState');
    await send('corruptBackup');
    await send('reload');
    const bak = await send('getBackup');
    let valid = false;
    try { valid = !!JSON.parse(bak).board; } catch (_) {}
    assert('Self-heal : copie de secours réparée', valid, 'bak = ' + String(bak).slice(0, 40));
  } catch (e) {
    assert('Self-heal : copie de secours réparée', false, e.message);
  }

  // ── 24. Import invalide rejeté avant écriture ────────────────
  try {
    const before = await send('cardCount');
    let threw = false;
    try {
      await send('import', { json: JSON.stringify({ board: { name: 'x' }, lists: [null], cards: [] }) });
    } catch (_) { threw = true; }
    assert('Import avec liste nulle rejeté', threw);
    assert('Board inchangé après import rejeté', (await send('cardCount')) === before);
  } catch (e) {
    assert('Import invalide', false, e.message);
  }

  // ── 25. Le rappel d'export ne survit pas à un reset ──────────
  try {
    await send('setBackupInfo', { info: { firstSeen: '2026-01-01', lastExport: null } });
    await send('reset');
    const bi = await send('backupInfo');
    assert('Reset purge les infos de sauvegarde', bi.firstSeen === null && bi.lastExport === null,
      JSON.stringify(bi));
  } catch (e) {
    assert('Reset purge les infos de sauvegarde', false, e.message);
  }

  // ── 26. Coller une carte préserve notes et tags ─────────────
  try {
    const l = await send('createList', { title: 'Collage' });
    await send('rebuild');
    const card = await send('createCard', { listId: l.id, text: 'Carte à coller' });
    await send('updateCardNotes', { id: card.id, notes: 'note importante' });
    await send('updateCardTags', { id: card.id, tags: ['urgent'] });
    await send('rebuild');
    await new Promise(r => setTimeout(r, 150));

    const w  = frame.contentWindow;
    const d  = frame.contentDocument;
    const KE = k => d.dispatchEvent(new (w.KeyboardEvent)('keydown', { key: k, bubbles: true, cancelable: true }));
    const lists = await send('getLists');
    const idx = lists.findIndex(x => x.id === l.id) + 1;
    KE(String(idx));
    await new Promise(r => setTimeout(r, 120));
    KE('y');
    await new Promise(r => setTimeout(r, 120));
    KE('p');
    await new Promise(r => setTimeout(r, 500));

    const cards = [...d.querySelectorAll('.list[data-id="' + l.id + '"] .card')];
    const pasted = cards.length === 2 ? cards[1] : null;
    const notesEl = pasted && pasted.querySelector('.card-notes');
    const tagsEl  = pasted && pasted.querySelector('.card-tags');
    assert('Collage : la carte affichée garde ses notes',
      !!notesEl && notesEl.value === 'note importante',
      'notes = ' + JSON.stringify(notesEl && notesEl.value));
    assert('Collage : la carte affichée garde ses tags',
      !!tagsEl && tagsEl.textContent.indexOf('urgent') !== -1,
      'tags = ' + (tagsEl && tagsEl.textContent));
  } catch (e) {
    assert('Collage notes/tags', false, e.message);
  }

  // ── 27. L'en-tête finit par être rendu ──────────────────────
  try {
    await send('rebuild');
    await new Promise(r => setTimeout(r, 200));
    const info = frame.contentDocument.getElementById('headerInfo').textContent;
    assert('En-tête rendu après rebuild', /\d+ listes?/.test(info), info);
  } catch (e) {
    assert('En-tête rendu après rebuild', false, e.message);
  }

  // ── 28. onSave : tous les abonnés notifiés, puis désabonnés ─
  try {
    const lists = await send('getLists');
    const r = await send('onSaveMulti', { listId: lists[0].id });
    assert('onSave notifie tous les abonnés et se désabonne',
      r.after === 11 && r.final === 11, 'après=' + r.after + ' final=' + r.final);
  } catch (e) {
    assert('onSave multi-abonnés', false, e.message);
  }

  // ── 29. Fichier modifié pendant la session ──────────────────
  try {
    await send('autoSaveMock', { mode: 'granted' });
    assert('Fichier inchangé → aucune détection',
      (await send('autoSaveCheckExternal')) === false);

    await send('autoSaveSetFile', { text: '{"board":{}}', modified: Date.now() + 60000 });
    const detected = await send('autoSaveCheckExternal');
    const pend = await send('autoSavePending');
    assert('Fichier externe détecté en session', detected === true && pend === 'reload',
      'detected=' + detected + ' pending=' + pend);
    assert('Pas de nouvelle détection tant que la décision est en attente',
      (await send('autoSaveCheckExternal')) === false);

    await send('autoSaveDismiss');
    await send('autoSaveMock', { mode: 'prompt' });
    assert('Pas de détection hors état actif',
      (await send('autoSaveCheckExternal')) === false);

    await send('autoSaveMock', { mode: 'granted' });
    await send('autoSaveFlush');
    const content = await send('autoSaveFile');
    await send('autoSaveSetFile', { text: content, modified: Date.now() + 60000 });
    assert('Contenu identique → aucune détection malgré un mtime plus récent',
      (await send('autoSaveCheckExternal')) === false);
  } catch (e) {
    assert('Détection en session', false, e.message);
  }

  // ── 30. Le message de restauration survit au rendu différé ──
  try {
    await send('autoSaveMock', { mode: 'granted' });
    await send('autoSaveSetFile', { text: await send('export'), modified: Date.now() + 60000 });
    await send('autoSaveResume');
    await new Promise(r => setTimeout(r, 150));
    frame.contentDocument.getElementById('restoreAccept').click();
    await new Promise(r => setTimeout(r, 250));
    const msg = frame.contentDocument.getElementById('headerInfo').textContent;
    assert('Le message de restauration survit au rendu différé', /rechargé|restauré/.test(msg), msg);
  } catch (e) {
    assert('Message de restauration', false, e.message);
  }

  // ── Résumé ──────────────────────────────────────────────────
  const total = pass + fail;
  const summary = document.createElement('div');
  summary.className = 'summary ' + (fail === 0 ? 'good' : 'bad');
  summary.textContent = fail === 0
    ? '\u2713 ' + pass + '/' + total + ' tests réussis'
    : '\u2717 ' + fail + '/' + total + ' échecs (' + pass + ' réussis)';
  resultsEl.appendChild(summary);
  statusEl.textContent = 'Terminé.';
}

frame.addEventListener('load', () => {
  setTimeout(run, 100);
});
</script>
</body>
</html>
