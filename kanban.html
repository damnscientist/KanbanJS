<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KanbanJS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='7' height='20' rx='1.5' fill='%23e8a85a' opacity='.15'/%3E%3Crect x='3' y='9' width='5' height='3' rx='1' fill='%23e8a85a'/%3E%3Crect x='3' y='14' width='5' height='3' rx='1' fill='%23e8a85a' opacity='.55'/%3E%3Crect x='12.5' y='6' width='7' height='20' rx='1.5' fill='%23e8a85a' opacity='.15'/%3E%3Crect x='13.5' y='9' width='5' height='3' rx='1' fill='%23e8a85a' opacity='.55'/%3E%3Crect x='23' y='6' width='7' height='20' rx='1.5' fill='%23e8a85a' opacity='.15'/%3E%3Crect x='24' y='9' width='5' height='3' rx='1' fill='%23e8a85a' opacity='.25'/%3E%3C/svg%3E" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    :focus:not(:focus-visible) { outline: none; }

    :root {
      --bg:           #1a1410;
      --surface:      #241e1a;
      --surface-2:    #2e2822;
      --surface-3:    #3a322c;
      --border:       #4a423c;
      --border-hover: #5a524c;
      --accent:       #e8a85a;
      --accent-hover: #f0ba72;
      --accent-rgb:   232, 168, 90;
      --danger:       #d95a4a;
      --danger-hover: #e87a6a;
      --danger-rgb:   217, 90, 74;
      --text:         #e0d8d0;
      --text-muted:   #8a8278;
      --text-dim:     #5a5248;
      --shadow:       0 4px 24px rgba(0,0,0,.45);
      --shadow-sm:    0 2px 8px rgba(0,0,0,.30);
      --radius:       10px;
      --radius-sm:    6px;
      --list-width:   290px;
      --transition:   .15s ease;
    }

    /* Thèmes sombres */
    [data-theme="deep-ocean"] {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface-2:    #1c2333;
      --surface-3:    #252d3f;
      --border:       #30363d;
      --border-hover: #484f58;
      --accent:       #58a6ff;
      --accent-hover: #79b8ff;
      --accent-rgb:   88, 166, 255;
      --danger:       #e06060;
      --danger-hover: #f08080;
      --danger-rgb:   224, 96, 96;
      --text:         #e6edf3;
      --text-muted:   #8b949e;
      --text-dim:     #484f58;
      --shadow:       0 4px 24px rgba(0,0,0,.45);
      --shadow-sm:    0 2px 8px rgba(0,0,0,.30);
    }

    [data-theme="forest"] {
      --bg:           #0f1412;
      --surface:      #18201c;
      --surface-2:    #1f2a24;
      --surface-3:    #28362e;
      --border:       #2f4036;
      --border-hover: #3f5448;
      --accent:       #5ecf9a;
      --accent-hover: #78d9ad;
      --accent-rgb:   94, 207, 154;
      --danger:       #d95a4a;
      --danger-hover: #e87a6a;
      --danger-rgb:   217, 90, 74;
      --text:         #e0ece6;
      --text-muted:   #8aa89a;
      --text-dim:     #4a6a58;
      --shadow:       0 4px 24px rgba(0,0,0,.45);
      --shadow-sm:    0 2px 8px rgba(0,0,0,.30);
    }

    [data-theme="tokyo-night"] {
      --bg:           #1a1b26;
      --surface:      #222436;
      --surface-2:    #292c42;
      --surface-3:    #323552;
      --border:       #3b3f5c;
      --border-hover: #4a4f70;
      --accent:       #7aa2f7;
      --accent-hover: #9ab7ff;
      --accent-rgb:   122, 162, 247;
      --danger:       #f7768e;
      --danger-hover: #f996a8;
      --danger-rgb:   247, 118, 142;
      --text:         #c0caf5;
      --text-muted:   #787c99;
      --text-dim:     #545c7e;
      --shadow:       0 4px 24px rgba(0,0,0,.45);
      --shadow-sm:    0 2px 8px rgba(0,0,0,.30);
    }

    /* Thèmes clairs */
    [data-theme="soft-sand"] {
      --bg:           #f7f3ee;
      --surface:      #faf6f0;
      --surface-2:    #f5f1ea;
      --surface-3:    #ece4da;
      --border:       #ddd5c8;
      --border-hover: #c5bba8;
      --accent:       #6b8fdd;
      --accent-hover: #5a7ecc;
      --accent-rgb:   107, 143, 221;
      --danger:       #cc5a4a;
      --danger-hover: #b84a3a;
      --danger-rgb:   204, 90, 74;
      --text:         #2c2418;
      --text-muted:   #7a7268;
      --text-dim:     #a59e92;
      --shadow:       0 4px 24px rgba(0,0,0,.10);
      --shadow-sm:    0 2px 8px rgba(0,0,0,.07);
    }

    [data-theme="mint"] {
      --bg:           #f0f7f4;
      --surface:      #ffffff;
      --surface-2:    #eaf3ee;
      --surface-3:    #d5e8dc;
      --border:       #c0d5c8;
      --border-hover: #a8c0b4;
      --accent:       #3a9b7a;
      --accent-hover: #2d8868;
      --accent-rgb:   58, 155, 122;
      --danger:       #cc5a4a;
      --danger-hover: #b84a3a;
      --danger-rgb:   204, 90, 74;
      --text:         #1a2e26;
      --text-muted:   #5a7a6a;
      --text-dim:     #8aa89a;
      --shadow:       0 4px 24px rgba(0,0,0,.10);
      --shadow-sm:    0 2px 8px rgba(0,0,0,.07);
    }

    [data-theme="lavender"] {
      --bg:           #f5f2f8;
      --surface:      #ffffff;
      --surface-2:    #f0ecf5;
      --surface-3:    #e2dce8;
      --border:       #d0c8d8;
      --border-hover: #b8aec4;
      --accent:       #8a6fbf;
      --accent-hover: #7a5faf;
      --accent-rgb:   138, 111, 191;
      --danger:       #cc5a4a;
      --danger-hover: #b84a3a;
      --danger-rgb:   204, 90, 74;
      --text:         #282030;
      --text-muted:   #70687a;
      --text-dim:     #a098aa;
      --shadow:       0 4px 24px rgba(0,0,0,.10);
      --shadow-sm:    0 2px 8px rgba(0,0,0,.07);
    }

    [data-theme="tokyo-light"] {
      --bg:           #e1e2e7;
      --surface:      #f6f7f9;
      --surface-2:    #ebecf0;
      --surface-3:    #d9dae0;
      --border:       #c4c6ce;
      --border-hover: #a7acba;
      --accent:       #2e6ed5;
      --accent-hover: #1e5ec5;
      --accent-rgb:   46, 110, 213;
      --danger:       #c64343;
      --danger-hover: #b33a3a;
      --danger-rgb:   198, 67, 67;
      --text:         #343b58;
      --text-muted:   #565f89;
      --text-dim:     #8b8fad;
      --shadow:       0 4px 24px rgba(0,0,0,.10);
      --shadow-sm:    0 2px 8px rgba(0,0,0,.07);
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .5px;
      color: var(--accent);
      user-select: none;
    }

    .board-name {
      font-size: 14px;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      cursor: pointer;
      transition: border-color var(--transition), color var(--transition);
      outline: none;
      min-width: 120px;
      user-select: none;
    }
    .board-name:hover, .board-name:focus {
      border-color: var(--accent);
      color: var(--text);
    }

    .spacer { flex: 1; }

    .progress-bar {
      width: 100px;
      height: 6px;
      border-radius: 3px;
      background: var(--surface-3);
      overflow: hidden;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--text);
      transition: width .3s ease, opacity .3s ease;
      width: 0%;
      opacity: 0;
    }
    .progress-pct {
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .streak-badge {
      display: none;
      font-size: 12px;
      color: var(--text);
      flex-shrink: 0;
      cursor: default;
    }
    .streak-badge.show { display: inline; }
    .streak-badge.paused { opacity: .4; }

    @keyframes progressPulse {
      0%   { filter: brightness(1); }
      50%  { filter: brightness(2); }
      100% { filter: brightness(1); }
    }
    .progress-fill.pulse { animation: progressPulse .6s ease; }

    .today-count { color: var(--accent); }

    .header-info {
      font-size: 12px;
      color: var(--text-dim);
    }

    #board {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 14px;
      padding: 20px 20px 20px 24px;
      overflow-x: auto;
      overflow-y: hidden;
      flex: 1;
    }

    #board::-webkit-scrollbar { height: 8px; }
    #board::-webkit-scrollbar-track { background: transparent; }
    #board::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }
    #board::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

    .list {
      display: flex;
      flex-direction: column;
      width: var(--list-width);
      min-width: var(--list-width);
      max-height: calc(100vh - 92px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition), border-color var(--transition);
      flex-shrink: 0;
      overflow: hidden;
      animation: fadeIn .18s ease;
    }

    .list.drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent), var(--shadow-sm);
    }

    .list-header {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      cursor: grab;
      user-select: none;
    }
    .list-header:active { cursor: grabbing; }
    .list-header input,
    .list-header button { cursor: auto; }
    .list-header .btn-icon { width: 22px; height: 22px; font-size: 13px; }

    .list-title {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 3px 6px;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }
    .list-title-input {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 3px 6px;
      outline: none;
      font-family: inherit;
      background: var(--surface-2);
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
      display: none;
    }
    .list-title-input.show { display: block; }

    .list-count {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface-2);
      border-radius: 10px;
      padding: 1px 7px;
      flex-shrink: 0;
    }

    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: background var(--transition), color var(--transition);
      flex-shrink: 0;
    }
    .btn-icon:hover { background: var(--surface-3); color: var(--text); }
    .btn-icon.danger { color: var(--danger); }
    .btn-icon.danger:hover { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger-hover); }
    .btn-icon.active { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
    .btn-icon.active:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-hover); }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px;
      overflow-y: auto;
      flex: 1;
      min-height: 8px;
    }

    .cards::-webkit-scrollbar { width: 5px; }
    .cards::-webkit-scrollbar-track { background: transparent; }
    .cards::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }

    .drop-placeholder {
      height: 54px;
      border: 2px dashed var(--accent);
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      pointer-events: none;
      flex-shrink: 0;
    }

    .list-placeholder {
      width: var(--list-width);
      min-width: var(--list-width);
      border: 2px dashed var(--accent);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      flex-shrink: 0;
      align-self: flex-start;
    }

    .dnd-ghost-list {
      max-height: 400px;
      overflow: hidden;
      transform: rotate(0.6deg);
    }

    .card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      cursor: grab;
      user-select: none;
      position: relative;
      transition: box-shadow var(--transition), border-color var(--transition), opacity var(--transition);
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn .12s ease;
    }
    .card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-sm); }
    .card:active { cursor: grabbing; }

    .card-text {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
      user-select: none;
    }

    .card-done .card-text {
      text-decoration: line-through;
      opacity: 0.55;
    }
    .card-done-at {
      display: none;
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .card-done .card-done-at { display: block; }

    .card-actions {
      display: none;
      position: absolute;
      top: 6px;
      right: 6px;
      gap: 3px;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 1px;
    }
    .card:hover .card-actions { display: flex; }
    .card-actions .btn-icon { width: 22px; height: 22px; font-size: 13px; }

    .card.editing { cursor: default; border-color: var(--accent); }
    .card.editing .card-text { display: none; }
    .card.editing .card-notes { display: none; }
    .card.editing .card-actions { display: none; }

    .card-editor {
      display: none;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      outline: none;
      min-height: 50px;
    }
    .card.editing .card-editor { display: block; }

    .card-editor-actions { display: none; gap: 6px; align-items: center; }
    .card.editing .card-editor-actions { display: flex; }

    .card-notes {
      display: none;
      width: 100%;
      background: transparent;
      border: none;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      line-height: 1.4;
      resize: none;
      outline: none;
      min-height: 28px;
      margin-top: 4px;
      padding: 6px 0 0;
    }
    .card-notes.open { display: block; }

    .card.card-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent), var(--shadow-sm);
    }
    .card.card-selected .card-actions { display: flex; }

    .list.list-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent), var(--shadow-sm);
    }

    .list.collapsed .cards,
    .list.collapsed .list-footer { display: none; }

    .list-count.wip-warn {
      color: var(--danger);
      background: rgba(var(--danger-rgb), .15);
      background: color-mix(in srgb, var(--danger) 15%, transparent);
    }

    .list-footer { padding: 6px 10px 10px; flex-shrink: 0; }

    .btn-add-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .btn-add-card:hover { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }
    .btn-add-card .icon { font-size: 18px; line-height: 1; }

    .new-card-form { display: none; flex-direction: column; gap: 7px; }
    .new-card-form.open { display: flex; }

    .new-card-form textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      padding: 7px 9px;
      resize: none;
      outline: none;
      min-height: 62px;
    }
    .new-card-form textarea::placeholder { color: var(--text-dim); }
    .new-card-form .form-actions { display: flex; align-items: center; gap: 7px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { background: var(--accent); opacity: .85; }
    .btn-ghost { background: transparent; color: var(--text-muted); }
    .btn-ghost:hover { background: var(--surface-3); color: var(--text); }
    .btn-ghost:active { background: var(--surface-2); }
    .btn:disabled, .btn-icon:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }

    .add-list-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: var(--list-width);
      min-width: var(--list-width);
      padding: 12px 14px;
      background: transparent;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
      flex-shrink: 0;
      align-self: flex-start;
    }
    .add-list-btn:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: var(--accent); color: var(--accent); }
    .add-list-btn .icon { font-size: 20px; line-height: 1; }

    .add-list-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: var(--list-width);
      min-width: var(--list-width);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
      align-self: flex-start;
    }
    .add-list-form.open { display: flex; }

    .add-list-form input {
      background: var(--surface-2);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 10px;
      outline: none;
    }
    .add-list-form input::placeholder { color: var(--text-dim); font-weight: 400; }
    .add-list-form .form-actions { display: flex; gap: 7px; align-items: center; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Modal ─────────────────────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 20000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 420px;
      max-width: 94vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      animation: fadeIn .15s ease;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title {
      flex: 1;
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-tab {
      flex: 1;
      padding: 10px 14px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: color var(--transition), border-color var(--transition);
      outline: none;
    }

    .modal-tab:hover { color: var(--text); }
    .modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: flex; flex-direction: column; gap: 14px; }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      overflow-y: auto;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .field-input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color var(--transition);
    }
    .field-input:focus { border-color: var(--accent); }
    .field-input::placeholder { color: var(--text-dim); }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cfg-status {
      font-size: 12px;
      color: var(--text-muted);
    }
    .cfg-status.success { color: var(--accent); }
    .cfg-status.error   { color: var(--danger); }

    /* ─── FAB (floating action button) ────────────────────────────────────── */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), transform var(--transition), bottom var(--transition);
    }
    .fab:hover { background: var(--accent-hover); transform: scale(1.08); }
    .fab.fab-no-api { background: var(--danger); opacity: 1; }
    .fab.fab-no-api:hover { background: var(--danger-hover); }


    /* Cheatsheet */
    .cheatsheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 18000;
      align-items: center;
      justify-content: center;
    }
    .cheatsheet-overlay.open { display: flex; }

    .cheatsheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      max-width: 440px;
      width: 92vw;
      max-height: 82vh;
      overflow-y: auto;
      animation: fadeIn .12s ease;
    }

    .cheatsheet h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin: 14px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .cheatsheet h3:first-child { margin-top: 0; }
    .cheatsheet-intro { margin-top: 14px; }

    .cheatsheet kbd {
      display: inline-block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 11px;
      color: var(--accent);
      min-width: 22px;
      text-align: center;
    }

    .cheatsheet .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      font-size: 12px;
      cursor: default;
    }
    .cheatsheet .row .keys { flex-shrink: 0; display: flex; gap: 3px; }
    .cheatsheet .row .desc { color: var(--text-muted); }

    .cheatsheet .cols {
      display: flex;
      gap: 28px;
    }
    .cheatsheet .col { flex: 1; }

    /* ─── Recherche ─────────────────────────────────────────── */
    .search-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 15000;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12vh;
    }
    .search-overlay.open { display: flex; }

    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 480px;
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      animation: fadeIn .1s ease;
    }

    .search-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 14px 16px;
      outline: none;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .search-input::placeholder { color: var(--text-dim); }

    .search-results {
      max-height: 360px;
      overflow-y: auto;
      padding: 6px 0;
    }
    .search-results:empty { display: none; }

    .search-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      cursor: pointer;
      transition: background var(--transition);
    }
    .search-result:hover,
    .search-result.active { background: var(--surface-2); }

    .search-result-text {
      color: var(--text);
      font-size: 13px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-result-list {
      color: var(--text-dim);
      font-size: 11px;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .search-empty {
      padding: 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* ─── Spinner ─────────────────────────────────────────────────────────── */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    .spinner.active { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Template banner ────────────────────────────────────────── */
    .template-banner {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: background var(--transition), border-color var(--transition);
    }
    .template-banner.open { display: flex; }
    .template-banner:hover {
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      border-color: var(--accent);
    }
    .template-banner:focus-visible {
      background: color-mix(in srgb, var(--accent) 20%, transparent);
      border-color: var(--accent);
      outline-offset: -1px;
    }
    .template-banner.disabled {
      opacity: .5;
      pointer-events: none;
      cursor: default;
    }
    .template-banner-icon { font-size: 16px; flex-shrink: 0; }
    .template-banner-text { flex: 1; }

    /* ─── Decompose textarea ──────────────────────────────────────────────── */
    .field-textarea {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      padding: 9px 10px;
      resize: vertical;
      outline: none;
      min-height: 80px;
      transition: border-color var(--transition);
    }
    .field-textarea:focus { border-color: var(--accent); }
    .field-textarea::placeholder { color: var(--text-dim); }

    /* ─── Debug panel ─────────────────────────────────────────────────────── */
    .debug-toggle {
      font-size: 11px;
      padding: 4px 8px;
      opacity: 0.6;
    }
    .debug-toggle:hover { opacity: 1; }

    .debug-panel {
      display: none;
      margin: 0;
      padding: 10px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 320px;
      overflow-y: auto;
    }
    .debug-panel.open { display: block; }
    .debug-panel .debug-label { color: var(--accent); }
    .debug-panel .debug-error  { color: var(--danger); }



    /* prefers-reduced-motion : désactive les animations non essentielles */
    @media (prefers-reduced-motion: reduce) {
      .card, .list { animation: none; }
      .progress-fill { transition: none; }
      .fab { transition: none; }
      .mobile-toolbar, .header-menu-sheet { animation: none; }
    }
  </style>
</head>
<body>

<script>
/* ============================================================
   THEME — sombre / clair / système
   Stockage 3 clés : mode | dark | light
   Extensible : plus de thèmes = ajouter dans THEMES.dark / .light
   ============================================================ */
(function initTheme() {
  const KEY_MODE  = 'kanbanjs:theme-mode';
  const KEY_DARK  = 'kanbanjs:theme-dark';
  const KEY_LIGHT = 'kanbanjs:theme-light';
  const LEGACY    = 'kanbanjs:theme';
  const toggle    = document.getElementById('themeToggle');

  const THEMES = {
    dark:  ['warm-night', 'deep-ocean', 'forest', 'tokyo-night'],
    light: ['soft-sand',  'mint',       'lavender', 'tokyo-light'],
  };

  const ICONS = { dark: '\u2600', light: '\u263E', system: '\u25D0' };
  const TITLES = { dark: 'Th\u00e8me\u00a0: sombre', light: 'Th\u00e8me\u00a0: clair', system: 'Th\u00e8me\u00a0: automatique (syst\u00e8me)' };

  const systemMedia = window.matchMedia('(prefers-color-scheme: dark)');

  function getStored(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (_) { return localStorage.getItem(key); }
  }
  function setStored(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

  function migrateLegacy() {
    const raw = localStorage.getItem(LEGACY);
    if (!raw) return;
    localStorage.removeItem(LEGACY);
    if (raw === 'light') { setStored(KEY_MODE, 'light'); setStored(KEY_LIGHT, 'soft-sand'); return; }
    if (raw === 'dark')  { setStored(KEY_MODE, 'dark');  setStored(KEY_DARK,  'warm-night'); return; }
    if (THEMES.dark.includes(raw))  { setStored(KEY_MODE, 'dark');  setStored(KEY_DARK,  raw); return; }
    if (THEMES.light.includes(raw)) { setStored(KEY_MODE, 'light'); setStored(KEY_LIGHT, raw); return; }
  }

  function resolveMode() {
    let mode = getStored(KEY_MODE);
    if (!mode || !['dark','light','system'].includes(mode)) mode = 'system';
    return mode;
  }

  function resolveTheme(mode) {
    if (mode === 'system') mode = systemMedia.matches ? 'dark' : 'light';
    const key = mode === 'dark' ? KEY_DARK : KEY_LIGHT;
    const fallback = mode === 'dark' ? 'warm-night' : 'soft-sand';
    const stored = getStored(key);
    return stored && (THEMES[mode] || []).includes(stored) ? stored : fallback;
  }

  function apply() {
    const mode = resolveMode();
    const theme = resolveTheme(mode);
    document.documentElement.setAttribute('data-theme', theme);
    toggle.textContent = ICONS[mode] || ICONS.system;
    toggle.title = TITLES[mode] || '';
  }

  function onSystemChange() {
    if (resolveMode() === 'system') apply();
  }

  function cycle() {
    const modes = ['dark', 'light', 'system'];
    const mode = resolveMode();
    const idx = modes.indexOf(mode);
    const next = modes[(idx + 1) % 3];
    if (mode === 'system') systemMedia.removeEventListener('change', onSystemChange);
    setStored(KEY_MODE, next);
    if (next === 'system') systemMedia.addEventListener('change', onSystemChange);
    apply();
  }

  migrateLegacy();

  const mode = resolveMode();
  if (mode === 'system') systemMedia.addEventListener('change', onSystemChange);
  apply();

  toggle.addEventListener('click', cycle);

  window.__themeAPI = {
    get mode()  { return resolveMode(); },
    get dark()  { return getStored(KEY_DARK) || 'warm-night'; },
    get light() { return getStored(KEY_LIGHT) || 'soft-sand'; },
    set dark(val)  { setStored(KEY_DARK, val); apply(); },
    set light(val) { setStored(KEY_LIGHT, val); apply(); },
  };
})();

/* ============================================================
   DATABASE ADAPTER — localStorage
   Interface publique stable : toutes les méthodes sont async
   et retournent des copies profondes. Chaque mutation persiste
   immédiatement dans localStorage.
   ============================================================ */
const DB = (() => {
  const KEY = 'kanbanjs:state';
  const uid = () => '_' + Math.random().toString(36).slice(2, 10);

  const _tutoId = uid();

  const _default = {
    board: { id: 'board-1', name: 'Mon Board' },
    lists: [
      { id: _tutoId,    title: 'Tuto',         position: 0, collapsed: false },
      { id: uid(), title: 'Backlog',     position: 1, collapsed: false },
      { id: uid(), title: 'In Progress', position: 2, collapsed: false },
      { id: uid(), title: 'Waiting',     position: 3, collapsed: false },
      { id: uid(), title: 'Done',        position: 4, done: true, collapsed: false },
    ],
    cards: [
      { id: uid(), listId: _tutoId, text: '1. Cliquer + pour décomposer une corvée',             position: 0, notes: '', doneAt: null },
      { id: uid(), listId: _tutoId, text: '2. L\'IA crée des micro-tâches (30s-3min)',       position: 1, notes: '', doneAt: null },
      { id: uid(), listId: _tutoId, text: '3. Adapter et glisser dans Backlog',               position: 2, notes: '', doneAt: null },
      { id: uid(), listId: _tutoId, text: '4. Cocher ✓ sur une liste pour la marquer fermée', position: 3, notes: '', doneAt: null },
    ],
  };

  // Cache mémoire (objets bruts, manipulés en place)
  let _state;
  let _saving = true;

  // ── Persistence ───────────────────────────────────────────
  function _load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.board && Array.isArray(parsed.lists) && Array.isArray(parsed.cards)) {
          return parsed;
        }
      }
    } catch (_) { /* ignore */ }
    return JSON.parse(JSON.stringify(_default));
  }

  function _save() {
    if (!_saving) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(_state));
    } catch (e) {
      if (e.name === 'QuotaExceededError') {
        alert('Espace de stockage saturé. Supprimez des listes ou des cartes.');
      } else {
        throw e;
      }
    }
  }

  // ── Helpers ───────────────────────────────────────────────
  function _clone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  // ── Init ──
  _state = _load();

  return {
    KEY,
    // ── Board ──────────────────────────────────────────────
    async getBoard()         { return _clone(_state.board); },
    async renameBoard(name)  { _state.board.name = name; _save(); return _clone(_state.board); },

    // ── Lists ──────────────────────────────────────────────
    async getLists() {
      const sorted = [..._state.lists].sort((a, b) => a.position - b.position);
      return _clone(sorted);
    },
    async createList(title) {
      const pos = _state.lists.length
        ? Math.max(..._state.lists.map(l => l.position)) + 1 : 0;
      const list = { id: uid(), title, position: pos, done: false, collapsed: false };
      _state.lists.push(list);
      _save();
      return _clone(list);
    },
    async renameList(id, title) {
      const l = _state.lists.find(l => l.id === id);
      if (l) { l.title = title; _save(); }
      return l ? _clone(l) : null;
    },
    async deleteList(id) {
      _state.lists = _state.lists.filter(l => l.id !== id);
      _state.cards = _state.cards.filter(c => c.listId !== id);
      _save();
    },
    async reorderList(id, newPos) {
      const list = _state.lists.find(l => l.id === id);
      if (!list) return;
      const others = _state.lists
        .filter(l => l.id !== id)
        .sort((a, b) => a.position - b.position);
      others.splice(newPos, 0, list);
      others.forEach((l, i) => { l.position = i; });
      _save();
    },
    async toggleListDone(id, doneAt) {
      const l = _state.lists.find(l => l.id === id);
      if (l) { l.done = !l.done; }
      if (doneAt !== undefined) {
        _state.cards.filter(c => c.listId === id).forEach(c => { c.doneAt = doneAt; });
      }
      _save();
      return l ? _clone(l) : null;
    },
    async toggleCollapsed(id) {
      const l = _state.lists.find(l => l.id === id);
      if (l) { l.collapsed = !l.collapsed; _save(); }
      return l ? _clone(l) : null;
    },

    // ── Cards ──────────────────────────────────────────────
    async getCards(listId) {
      const matches = _state.cards
        .filter(c => c.listId === listId)
        .sort((a, b) => a.position - b.position);
      return _clone(matches);
    },
    async createCard(listId, text) {
      const siblings = _state.cards.filter(c => c.listId === listId);
      const pos = siblings.length ? Math.max(...siblings.map(c => c.position)) + 1 : 0;
      const card = { id: uid(), listId, text, position: pos, notes: '', doneAt: null };
      _state.cards.push(card);
      _save();
      return _clone(card);
    },
    async updateCard(id, text) {
      const c = _state.cards.find(c => c.id === id);
      if (c) { c.text = text; _save(); }
      return c ? _clone(c) : null;
    },
    async updateCardNotes(id, notes) {
      const c = _state.cards.find(c => c.id === id);
      if (c) { c.notes = notes; _save(); }
      return c ? _clone(c) : null;
    },
    async setCardDoneAt(id, doneAt) {
      const c = _state.cards.find(c => c.id === id);
      if (c) { c.doneAt = doneAt; _save(); }
      return c ? _clone(c) : null;
    },
    async setCardsDoneAt(listId, doneAt) {
      _state.cards.filter(c => c.listId === listId).forEach(c => { c.doneAt = doneAt; });
      _save();
    },
    async deleteCard(id) {
      _state.cards = _state.cards.filter(c => c.id !== id);
      _save();
    },
    async moveCard(cardId, toListId, newPos) {
      const card = _state.cards.find(c => c.id === cardId);
      if (!card) return;
      card.listId = toListId;
      const siblings = _state.cards
        .filter(c => c.listId === toListId && c.id !== cardId)
        .sort((a, b) => a.position - b.position);
      siblings.splice(newPos, 0, card);
      siblings.forEach((c, i) => { c.position = i; });
      _save();
    },

    // ── Aggregate ───────────────────────────────────────────
    async getAllCards() { return _clone(_state.cards); },

    // ── Batching ────────────────────────────────────────────
    async batch(fn) {
      _saving = false;
      try { return await fn(); } finally { _saving = true; _save(); }
    },

    // ── Export / Import / Reset ──────────────────────────────
    async exportJSON()   { return JSON.stringify(_state); },
    async importJSON(json) {
      let parsed;
      try { parsed = JSON.parse(json); } catch (_) { throw new Error('JSON invalide.'); }
      if (!parsed.board || !Array.isArray(parsed.lists) || !Array.isArray(parsed.cards)) {
        throw new Error('Structure invalide (attendu : board, lists, cards).');
      }
      _state = parsed;
      _save();
    },
    async reset() {
      _state = JSON.parse(JSON.stringify(_default));
      _save();
    },
    async restoreJSON(json) {
      let parsed;
      try { parsed = JSON.parse(json); } catch (_) { return; }
      if (parsed.board && Array.isArray(parsed.lists) && Array.isArray(parsed.cards)) {
        _state = parsed;
        _save();
      }
    },
  };
})();

/* ============================================================
   DRAG & DROP — moteur générique (cartes + listes)
   ============================================================ */
const DnD = (() => {
  const THRESHOLD = 4;

  // Runtime
  let dragEl   = null;
  let ghostEl  = null;
  let dragId   = null;
  let ghost    = null;
  let ph       = null;
  let lastPos  = null;
  let offsetX=0, offsetY=0, startX=0, startY=0;
  let started  = false;
  let dropCb   = null;
  let cfg      = null;
  let pointerId= null;
  let _ctxMenu = null;

  function cleanup() {
    if (dragEl && pointerId != null) {
      try { dragEl.releasePointerCapture(pointerId); } catch (_) {}
    }
    if (ghost)  { ghost.remove(); ghost = null; }
    if (ph)     { ph.remove();    ph = null; }
    if (_ctxMenu) { document.removeEventListener('contextmenu', _ctxMenu); _ctxMenu = null; }
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup',   onUp);
    document.removeEventListener('pointercancel', onCancel);
    lastPos = null;
    dragEl = ghostEl = null;
    dragId = null;
    started = false;
    dropCb  = null;
    cfg     = null;
    pointerId = null;
    document.body.style.userSelect = '';
  }

  function startDrag() {
    started = true;
    if (dragEl && pointerId != null) {
      try { dragEl.setPointerCapture(pointerId); } catch (_) {}
    }
    document.body.style.userSelect = 'none';
    _ctxMenu = e => e.preventDefault();
    document.addEventListener('contextmenu', _ctxMenu);
    ghostEl = cfg.ghostEl || dragEl;
    const rect = ghostEl.getBoundingClientRect();

    ghost = cfg.ghostBuilder ? cfg.ghostBuilder() : ghostEl.cloneNode(true);
    ghost.style.cssText = `
      position: fixed;
      left: ${rect.left}px;
      top: ${rect.top}px;
      width: ${rect.width}px;
      opacity: 0.88;
      pointer-events: none;
      z-index: 10000;
      box-shadow: var(--shadow);
      will-change: left, top;
    `;
    if (cfg.ghostClass) ghost.classList.add(cfg.ghostClass);
    document.body.appendChild(ghost);

    ph = document.createElement('div');
    ph.className = cfg.phClass || 'drop-placeholder';
    ph.style.width  = rect.width  + 'px';
    ph.style.height = rect.height + 'px';
    ghostEl.replaceWith(ph);
    lastPos = null;
  }

  function syncPlaceholder(x, y) {
    const zone = cfg.getZone(x, y);
    if (!zone) {
      if (ph.parentNode) { ph.remove(); lastPos = null; }
      return;
    }
    const after = cfg.getAfter(zone.container, x, y, ghostEl);
    if (lastPos && lastPos.container === zone.container && lastPos.after === after) return;

    if (after) zone.container.insertBefore(ph, after);
    else zone.container.appendChild(ph);
    lastPos = { container: zone.container, after, id: zone.id };
  }

  function onMove(e) {
    e.preventDefault();
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!started && Math.hypot(dx, dy) < THRESHOLD) return;
    if (!started) startDrag();

    ghost.style.left = (e.clientX - offsetX) + 'px';
    ghost.style.top  = (e.clientY - offsetY) + 'px';
    syncPlaceholder(e.clientX, e.clientY);
  }

  function onUp(e) {
    e.preventDefault();
    if (!started) { cleanup(); return; }
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup',   onUp);
    document.removeEventListener('pointercancel', onCancel);

    if (lastPos && ph.parentNode) {
      const newPos = cfg.getPos(lastPos.container, ph);
      ph.replaceWith(ghostEl);
      const targetId = lastPos.id;
      const cb = dropCb;
      const id = dragId;
      cleanup();
      cb(id, targetId, newPos);
    } else {
      ph.replaceWith(ghostEl);
      cleanup();
    }
  }

  function onCancel(e) {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup',   onUp);
    document.removeEventListener('pointercancel', onCancel);
    if (ph) ph.replaceWith(ghostEl);
    cleanup();
  }

  // ── API publique ────────────────────────────────────────
  function start(dragElement, id, options, onDrop) {
    dragElement.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('button, input, textarea, [data-no-drag]')) return;
      if (options.skip && options.skip(dragElement)) return;
      if (dragEl) cleanup();

      // La capture est posée dans startDrag()
      // seulement quand le seuil de 4px est dépassé. Les clics
      // simples / doubles atteignent donc leurs cibles normalement.

      const rect = dragElement.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      startX  = e.clientX;
      startY  = e.clientY;
      dragEl  = dragElement;
      dragId  = id;
      dropCb  = onDrop;
      cfg     = options;
      started = false;
      pointerId = e.pointerId;

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup',   onUp);
      document.addEventListener('pointercancel', onCancel);
    });
  }

  return { start };
})();

/* ============================================================
   APP
   ============================================================ */
const App = (() => {
  const boardEl        = document.getElementById('board');
  const boardNameInput = document.getElementById('boardName');
  const headerInfoEl   = document.getElementById('headerInfo');
  const Theme           = window.__themeAPI;

  // ── Helpers ──────────────────────────────────────────────
  function make(tag, className) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    return e;
  }

  function autoResize(ta) {
    if (!ta.offsetParent) return; // encore display:none
    ta.style.height = 'auto';
    ta.style.height = Math.max(ta.scrollHeight, ta.rows ? ta.rows * 20 : 28) + 'px';
  }

  async function refreshHeaderInfo() {
    const lists = await DB.getLists();
    const allCards = await DB.getAllCards();
    const doneListIds = new Set(lists.filter(l => l.done).map(l => l.id));
    const total = allCards.length;
    const done  = allCards.filter(c => doneListIds.has(c.listId)).length;
    let infoHTML =
      `${lists.length} liste${lists.length !== 1 ? 's' : ''} \u00b7 ${done}/${total} carte${total !== 1 ? 's' : ''}`;

    const s = readStreak();
    const today = new Date().toISOString().slice(0, 10);
    if (s.todayDate === today && s.todayCount > 0) {
      infoHTML += ` \u00b7 <span class="today-count">${s.todayCount} aujourd\u2019hui</span>`;
    }
    headerInfoEl.innerHTML = infoHTML;

    const pct = total ? Math.round(done / total * 100) : 0;
    const fill = document.getElementById('progressFill');
    fill.style.width   = pct + '%';
    fill.style.opacity  = pct / 100;
    document.getElementById('progressPct').textContent = pct + '%';

    const badge = document.getElementById('streakBadge');
    if (s.streak >= 2) {
      badge.textContent = '\uD83D\uDD25 ' + s.streak;
      badge.title = s.streak + ' jours cons\u00e9cutifs avec au moins une t\u00e2che termin\u00e9e';
      badge.classList.add('show');
      if (s.lastDate !== today) badge.classList.add('paused');
      else badge.classList.remove('paused');
    } else {
      badge.classList.remove('show', 'paused');
    }
  }

  const STREAK_KEY = 'kanbanjs:streak';

  function readStreak() {
    try {
      const raw = localStorage.getItem(STREAK_KEY);
      return raw ? JSON.parse(raw) : { streak: 0, lastDate: null, todayCount: 0, todayDate: null };
    } catch (_) { return { streak: 0, lastDate: null, todayCount: 0, todayDate: null }; }
  }

  function writeStreak(data) {
    try { localStorage.setItem(STREAK_KEY, JSON.stringify(data)); } catch (_) {}
  }

  function updateStreak(increment = 1) {
    const s = readStreak();
    const today = new Date().toISOString().slice(0, 10);
    if (s.todayDate !== today) {
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      s.streak = s.lastDate === yesterday ? s.streak + 1 : 1;
      s.lastDate = today;
      s.todayCount = increment;
      s.todayDate = today;
    } else {
      s.todayCount += increment;
    }
    writeStreak(s);
  }

  function pulseProgress() {
    const fill = document.getElementById('progressFill');
    fill.classList.remove('pulse');
    void fill.offsetWidth;
    fill.classList.add('pulse');
  }

  async function refreshCountBadge(listId) {
    const listEl = boardEl.querySelector(`.list[data-id="${listId}"]`);
    if (!listEl) return;
    const badge   = listEl.querySelector('.list-count');
    if (!badge) return;
    const cards = await DB.getCards(listId);
    const total = cards.length;
    badge.textContent = total || '0';
    const title    = listEl.querySelector('.list-title');
    const titleVal = title ? title.textContent.toLowerCase() : '';
    const isDone   = listEl.dataset.done === 'true';
    const warn     = !isDone && (titleVal.includes('wip') || titleVal.includes('in progress')) && total >= 3;
    badge.classList.toggle('wip-warn', warn);
  }

  function readAIConfig() {
    try {
      const raw = localStorage.getItem('kanbanjs:config');
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function flashMessage(el, msg, cls, ms) {
    if (el._timer) clearTimeout(el._timer);
    el.textContent = msg;
    el.className   = cls ? 'cfg-status ' + cls : 'cfg-status';
    if (ms) el._timer = setTimeout(() => { el.textContent = ''; el.className = 'cfg-status'; }, ms);
  }

  function removeListDom(listId) {
    const el = boardEl.querySelector('.list[data-id="' + listId + '"]');
    if (el) el.remove();
  }

  function toggleForm(btn, form, input, open) {
    if (open) {
      btn.style.display = 'none';
      form.classList.add('open');
      input.focus();
    } else {
      input.value = '';
      if (input.tagName === 'TEXTAREA') input.style.height = '';
      form.classList.remove('open');
      btn.style.display = '';
    }
  }

  function registerOverlay(overlay, closeFn) {
    overlay.addEventListener('click', e => { if (e.target === overlay) closeFn(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeFn();
    });
  }

  function formatDoneAt(iso) {
    const d = new Date(iso);
    return 'Terminé le ' + d.toLocaleDateString('fr-FR') + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function extractCardData(el) {
    const textEl = el.querySelector('.card-text');
    const notesEl = el.querySelector('.card-notes');
    return { text: textEl ? textEl.textContent : '', notes: notesEl ? notesEl.value : '' };
  }

  function extractListData(el) {
    const titleEl = el.querySelector('.list-title');
    const title = titleEl ? titleEl.textContent : '';
    const cards = [...el.querySelectorAll('.card')].map(c => extractCardData(c));
    return { title, cards };
  }

  // ── Undo / Redo ──────────────────────────────────────────
  const MAX_UNDO = 30;
  const UK = 'kanbanjs:undo';
  const RK = 'kanbanjs:redo';

  function _loadStack(key) {
    try { return JSON.parse(sessionStorage.getItem(key)) || []; } catch (_) { return []; }
  }
  function _saveStack(key, arr) { sessionStorage.setItem(key, JSON.stringify(arr)); }

  async function _snapshot() {
    const json = await DB.exportJSON();
    if (json.length > 200_000) return;
    const undo = _loadStack(UK);
    undo.push(json);
    if (undo.length > MAX_UNDO) undo.shift();
    _saveStack(UK, undo);
    _saveStack(RK, []);
  }

  async function mutate(fn) { await _snapshot(); return await fn(); }

  async function _undo() {
    const undo = _loadStack(UK);
    if (!undo.length) return;
    const redo = _loadStack(RK);
    redo.push(await DB.exportJSON());
    _saveStack(RK, redo);
    await DB.restoreJSON(undo.pop());
    _saveStack(UK, undo);
    await _rebuild();
  }

  async function _redo() {
    const redo = _loadStack(RK);
    if (!redo.length) return;
    const undo = _loadStack(UK);
    undo.push(await DB.exportJSON());
    _saveStack(UK, undo);
    await DB.restoreJSON(redo.pop());
    _saveStack(RK, redo);
    await _rebuild();
  }

  function _undoSize() { return _loadStack(UK).length; }
  function _redoSize() { return _loadStack(RK).length; }

  // ── CARD ─────────────────────────────────────────────────
  function buildCard(card, done) {
    const wrap = make('div', 'card');
    if (done) wrap.classList.add('card-done');
    wrap.dataset.id     = card.id;
    wrap.dataset.listId = card.listId;

    const textEl = make('div', 'card-text');
    textEl.textContent = card.text;

    const doneAtEl = make('div', 'card-done-at');
    if (card.doneAt) doneAtEl.textContent = formatDoneAt(card.doneAt);

    // Hover actions
    const actionsEl = make('div', 'card-actions');
    const editBtn   = make('button', 'btn-icon');
    editBtn.title       = 'Modifier';
    editBtn.textContent = '\u270e';
    const notesBtn  = make('button', 'btn-icon');
    notesBtn.title       = 'Notes';
    notesBtn.textContent = '\u2261';
    const delBtn = make('button', 'btn-icon danger');
    delBtn.title       = 'Supprimer';
    delBtn.textContent = '\u2715';
    actionsEl.append(editBtn, notesBtn, delBtn);

    // Notes
    const notesEl = make('textarea', 'card-notes');
    notesEl.rows = 2;
    notesEl.placeholder = 'Note personnelle\u2026';
    notesEl.value = card.notes || '';

    // Editor
    const editor = make('textarea', 'card-editor');
    editor.rows = 2;

    const editorActions = make('div', 'card-editor-actions');
    const saveBtn   = make('button', 'btn btn-primary');
    saveBtn.textContent   = 'Sauver';
    const cancelBtn = make('button', 'btn btn-ghost');
    cancelBtn.textContent = 'Annuler';
    editorActions.append(saveBtn, cancelBtn);

    wrap.append(textEl, doneAtEl, notesEl, actionsEl, editor, editorActions);

    function enterEdit() {
      wrap.classList.add('editing');
      editor.value = card.text;
      editor.focus();
      autoResize(editor);
    }
    function exitEdit() {
      wrap.classList.remove('editing');
    }
    async function saveEdit() {
      if (!wrap.classList.contains('editing')) return;
      const text = editor.value.trim();
      if (!text) { exitEdit(); return; }
      await mutate(() => DB.updateCard(card.id, text));
      card.text          = text;
      textEl.textContent = text;
      exitEdit();
    }

    function toggleNotes() {
      notesEl.classList.toggle('open');
      if (notesEl.classList.contains('open')) {
        notesEl.focus();
        requestAnimationFrame(() => {
          requestAnimationFrame(() => autoResize(notesEl));
        });
      }
    }

    async function saveNotes() {
      const notes = notesEl.value;
      await mutate(() => DB.updateCardNotes(card.id, notes));
      card.notes = notes;
    }

    editor.addEventListener('blur',    () => saveEdit());
    editor.addEventListener('input',   () => autoResize(editor));
    editor.addEventListener('keydown', e => {
      if (e.key === 'Escape') exitEdit();
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
    });
    editBtn.addEventListener('click',   e => { e.stopPropagation(); enterEdit(); });
    notesBtn.addEventListener('click',  e => { e.stopPropagation(); toggleNotes(); });
    notesEl.addEventListener('blur',    () => saveNotes());
    notesEl.addEventListener('input',   () => autoResize(notesEl));
    notesEl.addEventListener('keydown', e => { if (e.key === 'Escape') { notesEl.classList.remove('open'); notesEl.blur(); } });
    saveBtn.addEventListener('click',   saveEdit);
    cancelBtn.addEventListener('click', exitEdit);

    delBtn.addEventListener('click', async e => {
      e.stopPropagation();
      await mutate(() => DB.deleteCard(card.id));
      if (_selCard === wrap) _selCard = null;
      const currentListId = wrap.dataset.listId;
      wrap.remove();
      await refreshCountBadge(currentListId);
      await refreshHeaderInfo();
    });

    let _zoneCache = null;
    let _cardCache = null;

    // Drag & drop souris
    DnD.start(wrap, card.id, {
      getZone(x, y) {
        const sl = boardEl.scrollLeft;
        if (!_zoneCache || _zoneCache._sl !== sl) {
          _zoneCache = new Map();
          _zoneCache._sl = sl;
          for (const list of boardEl.querySelectorAll('.list')) {
            _zoneCache.set(list, list.getBoundingClientRect());
          }
        }
        for (const [list, r] of _zoneCache) {
          if (!list.isConnected) continue;
          if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
            return { container: list.querySelector('.cards'), id: list.dataset.id };
          }
        }
        return null;
      },
      getAfter(container, x, y) {
        const st = container.scrollTop;
        const sl = boardEl.scrollLeft;
        if (!_cardCache || _cardCache._container !== container || _cardCache._st !== st || _cardCache._sl !== sl) {
          _cardCache = new Map();
          _cardCache._container = container;
          _cardCache._st = st;
          _cardCache._sl = sl;
          for (const c of container.querySelectorAll('.card')) {
            if (c !== wrap) _cardCache.set(c, c.getBoundingClientRect());
          }
        }
        for (const c of container.querySelectorAll('.card')) {
          if (c === wrap) continue;
          const box = _cardCache.get(c);
          if (!box) continue;
          if (y < box.top + box.height / 2) return c;
        }
        return null;
      },
      getPos(container, ph) { return [...container.children].indexOf(ph); },
      skip(el) { return el.classList.contains('editing'); },
    }, async (cardId, toListId, newPos) => {
      _zoneCache = null;
      _cardCache = null;
      const sourceListId = wrap.dataset.listId;
      await mutate(() => DB.moveCard(cardId, toListId, newPos));
      wrap.dataset.listId = toListId;
      const destListEl = boardEl.querySelector('.list[data-id="' + toListId + '"]');
      const isDestDone = destListEl && destListEl.dataset.done === 'true';
      const wasDone = wrap.classList.contains('card-done');
      wrap.classList.toggle('card-done', isDestDone);
      if (isDestDone && !wasDone) {
        const now = new Date().toISOString();
        await DB.setCardDoneAt(cardId, now);
        updateStreak();
        pulseProgress();
        const atEl = wrap.querySelector('.card-done-at');
        if (atEl) atEl.textContent = formatDoneAt(now);
      } else if (!isDestDone && wasDone) {
        await DB.setCardDoneAt(cardId, null);
        const atEl = wrap.querySelector('.card-done-at');
        if (atEl) atEl.textContent = '';
      }
      if (sourceListId !== toListId) await refreshCountBadge(sourceListId);
      await refreshCountBadge(toListId);
      await refreshHeaderInfo();
    });

    return wrap;
  }

  // ── LIST ─────────────────────────────────────────────────
  function buildList(list, cards) {
    const wrap = make('div', 'list');
    wrap.dataset.id = list.id;
    wrap.dataset.done = list.done ? 'true' : 'false';
    if (list.collapsed) wrap.classList.add('collapsed');

    // Header
    const headerEl = make('div', 'list-header');
    const titleSpan = make('span', 'list-title');
    titleSpan.textContent = list.title;
    const titleInput = make('input', 'list-title-input');
    titleInput.type  = 'text';
    titleInput.maxLength = 200;
    const countBadge = make('span', 'list-count');
    countBadge.textContent = '0';
    const doneToggle = make('button', 'btn-icon');
    doneToggle.title       = 'Marquer comme liste termin\u00E9e';
    doneToggle.textContent = '\u2713';
    doneToggle.dataset.done = list.done ? 'true' : 'false';
    if (list.done) doneToggle.classList.add('active');
    const collapseBtn = make('button', 'btn-icon');
    collapseBtn.title = 'Replier la liste';
    collapseBtn.textContent = list.collapsed ? '\u25B8' : '\u25BE';
    if (list.collapsed) collapseBtn.classList.add('active');
    const delListBtn = make('button', 'btn-icon danger');
    delListBtn.title       = 'Supprimer la liste';
    delListBtn.textContent = '\u{1F5D1}';
    headerEl.append(titleSpan, titleInput, countBadge, doneToggle, collapseBtn, delListBtn);

    // Cards container
    const cardsEl = make('div', 'cards');

    // Footer
    const footerEl   = make('div', 'list-footer');
    const addCardBtn = make('button', 'btn-add-card');
    const iconSpan   = make('span', 'icon');
    iconSpan.textContent = '\uFF0B';
    addCardBtn.append(iconSpan, document.createTextNode(' Ajouter une carte'));

    const newCardForm = make('div', 'new-card-form');
    const newCardTA   = make('textarea');
    newCardTA.placeholder = 'Contenu de la carte\u2026';
    newCardTA.rows = 2;

    headerEl.addEventListener('dblclick', e => {
      if (e.target.closest('.list-title')) enterRename();

        g.style.width = 'var(--list-width)';
        const h = headerEl.cloneNode(true);
        h.querySelectorAll('.btn-icon').forEach(b => b.remove());
        g.appendChild(h);
        return g;
      },
      phClass:   'list-placeholder',
      getZone(x, y) {
        const r = boardEl.getBoundingClientRect();
        return (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom)
          ? { container: boardEl, id: null }
          : null;
      },
      getAfter(container, x) {
        for (const l of container.querySelectorAll('.list')) {
          if (l === wrap) continue;
          const box = l.getBoundingClientRect();
          if (x < box.left + box.width / 2) return l;
        }
        // Insérer avant le bouton "Ajouter une liste"
        return container.querySelector(':scope > :not(.list):not(.list-placeholder)') || null;
      },
      getPos(container, ph) {
        const children = [...container.children];
        const idx = children.indexOf(ph);
        return children.slice(0, idx).filter(c => c.matches('.list')).length;
      },
    }, async (listId, _, newPos) => {
      await mutate(() => DB.reorderList(listId, newPos));
    });

    return wrap;
  }

  function parseAITasks(raw) {
    function accept(arr) {
      if (!Array.isArray(arr)) return null;
      const filtered = arr.filter(t => typeof t === 'string' && t.trim().length > 0);
      return filtered.length ? filtered : null;
    }

    // Essaie de parser le JSON directement
    try {
      const result = accept(JSON.parse(raw));
      if (result) return result;
    } catch (_) { /* continue */ }

    // Cherche le premier tableau JSON complet (gère crochets imbriqués)
    let depth = 0, start = -1, inString = false, escape = false;
    for (let i = 0; i < raw.length; i++) {
      const c = raw[i];
      if (escape) { escape = false; continue; }
      if (c === '\\') { escape = true; continue; }
      if (c === '"') { inString = !inString; continue; }
      if (inString) continue;
      if (c === '[') { if (depth === 0) start = i; depth++; }
      else if (c === ']') {
        depth--;
        if (depth === 0 && start !== -1) {
          try {
            const result = accept(JSON.parse(raw.slice(start, i + 1)));
            if (result) return result;
          } catch (_) { /* continue */ }
          start = -1;
        }
      }
    }
    return null;
  }

  async function queryAI(task, log) {
    const cfg = readAIConfig();
    log('Fournisseur : ' + (cfg && cfg.provider ? cfg.provider : 'openai'));
    log('Modèle      : ' + (cfg && cfg.model    ? cfg.model    : 'non configuré'));

    if (!cfg || !cfg.apiKey || !cfg.model) {
      throw new Error('Configuration API manquante. Cliquez sur \u2699 dans le header.');
    }

    const provider = cfg.provider || 'openai';
    const prompt = PROMPT_SYSTEM.replace('{{TASK}}', task);
    log('Taille du prompt : ' + prompt.length + ' caractères');

    let url, headers, body;

    if (provider === 'openai') {
      if (!cfg.endpoint) throw new Error('Endpoint requis. Cliquez sur \u2699 dans le header.');
      url = cfg.endpoint;
      headers = {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + cfg.apiKey,
      };
      body = JSON.stringify({
        model: cfg.model,
        messages: [
          { role: 'system', content: prompt },
          { role: 'user', content: 'Décompose cette tâche en micro-actions. Réponds uniquement avec le tableau JSON.' },
        ],
        temperature: 0.3,
        max_tokens: 2048,
      });
    } else if (provider === 'anthropic') {
      url = cfg.endpoint || 'https://api.anthropic.com/v1/messages';
      headers = {
        'Content-Type': 'application/json',
        'x-api-key': cfg.apiKey,
        'anthropic-version': '2023-06-01',
      };
      body = JSON.stringify({
        model: cfg.model,
        max_tokens: 4096,
        system: prompt,
        messages: [{ role: 'user', content: 'Décompose cette tâche selon les consignes.' }],
      });
    } else if (provider === 'google') {
      url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
            cfg.model + ':generateContent?key=' + encodeURIComponent(cfg.apiKey);
      headers = { 'Content-Type': 'application/json' };
      body = JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.3, maxOutputTokens: 2048 },
      });
    } else {
      throw new Error('Fournisseur inconnu : ' + provider);
    }

    log('Requête POST → ' + url.split('?')[0]);

    let resp;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60_000);
      try {
        resp = await fetch(url, { method: 'POST', headers, body, signal: ctrl.signal });
      } finally {
        clearTimeout(timer);
      }
    } catch (netErr) {
      log('ERREUR RÉSEAU : ' + netErr.message);
      throw new Error(netErr.name === 'AbortError'
        ? 'Délai dépassé (60s). Voir debug \u2193'
        : 'Erreur réseau. Voir debug \u2193');
    }

    log('Status HTTP : ' + resp.status + ' ' + resp.statusText);

    const rawText = await resp.text();
    log('--- RÉPONSE BRUTE (' + rawText.length + ' car.) ---');
    log(rawText.slice(0, 3000));

    if (!resp.ok) {
      let apiMsg = '';
      try { const err = JSON.parse(rawText); apiMsg = err.error?.message || ''; } catch (_) {}
      log('ERREUR API : ' + (apiMsg || rawText.slice(0, 200)));
      throw new Error(apiMsg || ('Erreur API (' + resp.status + '). Voir debug \u2193'));
    }

    let data;
    try {
      data = JSON.parse(rawText);
    } catch (_) {
      throw new Error('Réponse non-JSON. Voir debug \u2193');
    }

    log('--- JSON PARSÉ ---');
    log(JSON.stringify(data, null, 2).slice(0, 3000));

    let tokens = 0;
    if (provider === 'openai') {
      const u = data.usage;
      if (u) tokens = (u.prompt_tokens || 0) + (u.completion_tokens || 0);
    } else if (provider === 'anthropic') {
      const u = data.usage;
      if (u) tokens = (u.input_tokens || 0) + (u.output_tokens || 0);
    } else if (provider === 'google') {
      const u = data.usageMetadata;
      if (u) tokens = (u.promptTokenCount || 0) + (u.candidatesTokenCount || 0);
    }
    log('Tokens      : ' + tokens);

    let content;

    if (provider === 'openai') {
      content = data.choices?.[0]?.message?.content;
    } else if (provider === 'anthropic') {
      content = data.content?.[0]?.text;
    } else if (provider === 'google') {
      content = data.candidates?.[0]?.content?.parts?.[0]?.text;
    }

    if (!content) {
      log('ERREUR : pas de contenu dans la réponse');
      throw new Error('Réponse sans contenu. Voir debug \u2193');
    }

    log('--- CONTENT (' + content.length + ' car.) ---');
    log(content.slice(0, 3000));

    const tasks = parseAITasks(content);

    if (tasks) {
      log('--- TÂCHES EXTRAITES (' + tasks.length + ') ---');
      tasks.forEach((t, i) => log('  ' + (i + 1) + '. ' + t));
    } else {
      log('ÉCHEC DU PARSING : aucun tableau JSON trouvé');
    }

    if (!tasks || tasks.length === 0) throw new Error('Aucune sous-tâche extraite. Voir debug \u2193');

    return { tasks, tokens };
  }

  async function createSuggestionsList(tasks, tokens) {
    const allLists = await DB.getLists();
    const existing = allLists.find(l => l.title.startsWith('IA '));
    let oldId = existing ? existing.id : null;
    const listTitle = 'IA (' + tokens + ' tokens)';

    const list = await mutate(() => DB.batch(async () => {
      if (existing) await DB.deleteList(existing.id);
      const l = await DB.createList(listTitle);
      await DB.reorderList(l.id, 0);
      await Promise.all(tasks.map(t => DB.createCard(l.id, t)));
      return l;
    }));
    const cards = await DB.getCards(list.id);

    // 2. Mise à jour DOM
    if (oldId) removeListDom(oldId);
    const listEl = buildList(list, cards);
    boardEl.insertBefore(listEl, boardEl.firstChild);
    await refreshHeaderInfo();
  }

  async function createTemplateList(template) {
    const list = await mutate(() => DB.batch(async () => {
      const l = await DB.createList(template.name);
      await DB.reorderList(l.id, 0);
      await Promise.all(template.tasks.map(t => DB.createCard(l.id, t)));
      return l;
    }));
    const cards = await DB.getCards(list.id);
    const listEl = buildList(list, cards);
    boardEl.insertBefore(listEl, boardEl.firstChild);
    await refreshHeaderInfo();
  }

  // ── Decompose modal / FAB ──────────────────────────────────
  (() => {

    const debugToggle = document.getElementById('debugToggle');

    function debugLog(msg) {
      debugLines.push(msg);
    }

    function renderDebug() {
      debugPanel.innerHTML = debugLines.map(l => {
        if (l.startsWith('ERREUR')) return '<span class="debug-error">' + esc(l) + '</span>';
        if (l.startsWith('---'))    return '\n<span class="debug-label">' + esc(l) + '</span>';
        return '<span class="debug-label">\u2192 </span>' + esc(l);
      }).join('\n');
      debugPanel.scrollTop = 0;
    }

    function open() {
      input.value = '';
      debugLines.length = 0;
      debugPanel.innerHTML = '';
      debugPanel.classList.remove('open');
      debugToggle.textContent = '\u25BC Debug';
      overlay.classList.add('open');
      spinner.classList.remove('active');
      btn.disabled = false;
      statusEl.textContent = '';
      statusEl.className = 'cfg-status';

      templateBanner.removeAttribute('tabindex');
