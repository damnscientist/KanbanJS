      overlay.classList.remove('open');
    }

    debugToggle.addEventListener('click', () => {
      debugPanel.classList.toggle('open');
      debugToggle.textContent = debugPanel.classList.contains('open') ? '\u25B2 Debug' : '\u25BC Debug';
    });

    fab.addEventListener('click', open);
    document.getElementById('decomposeModalClose').addEventListener('click', close);
    registerOverlay(overlay, close);

    const modalBody = overlay.querySelector('.modal-body');
    const modalActions = overlay.querySelector('.modal-actions');
    const templateBanner = make('div', 'template-banner');
    templateBanner.innerHTML = '<span class="template-banner-icon">\uD83D\uDCA1</span><span class="template-banner-text"></span>';
    templateBanner.addEventListener('click', async () => {
      if (templateBanner._template && !templateBanner.classList.contains('disabled')) {
        templateBanner.classList.add('disabled');
        try {
          await createTemplateList(templateBanner._template);
          close();
        } catch (err) {
          flashMessage(statusEl, err.message, 'error', 6000);
        } finally {
          templateBanner.classList.remove('disabled');
        }
      }
    });
    templateBanner.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && templateBanner._template) {
        e.preventDefault();
        templateBanner.click();
      }
    });
    modalBody.insertBefore(templateBanner, modalActions);

    function fuzzyMatch(text, query) {
      const t = text.toLowerCase();
      const q = query.toLowerCase();
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    input.addEventListener('input', () => {
      const query = input.value.trim();
      templateBanner.classList.remove('open');
      templateBanner.removeAttribute('tabindex');
      templateBanner._template = null;
      if (!query || query.length < 4) return;
      for (const t of TEMPLATES) {
        if (fuzzyMatch(t.name, query)) {
          templateBanner.querySelector('.template-banner-text').textContent =
            'Template sugg\u00E9r\u00E9 : ' + t.name + ' \u2014 Utiliser ce template';
          templateBanner.classList.add('open');
          templateBanner.setAttribute('tabindex', '0');
          templateBanner._template = t;
          return;
        }
      }
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); btn.click(); }
    });

    btn.addEventListener('click', async () => {
      const task = input.value.trim();
      if (!task) { flashMessage(statusEl, 'Décrivez une tâche.', 'error', 6000); return; }

      btn.disabled = true;
      spinner.classList.add('active');
      flashMessage(statusEl, 'Analyse en cours…', '', 0);
      debugLines.length = 0;

      try {
        const { tasks, tokens } = await queryAI(task, debugLog);
        renderDebug();
        if (!tasks || tasks.length === 0) throw new Error('Aucune sous-tâche générée.');
        await createSuggestionsList(tasks, tokens);
        close();
      } catch (err) {
        renderDebug();
        debugPanel.classList.add('open');
        debugToggle.textContent = '\u25B2 Debug';
        flashMessage(statusEl, err.message, 'error', 6000);
      } finally {
        btn.disabled = false;
        spinner.classList.remove('active');
      }
    });
  })();

  // ── CLAVIER ────────────────────────────────────────────────
  let _selCard    = null;
  let _selList    = null;
  const Clipboard = {
    _data: null,
    copyCard(data) { this._data = { type: 'card', text: data.text, notes: data.notes }; },
    cutCard(data)  { this._data = { type: 'card', text: data.text, notes: data.notes }; },
    copyList(data) { this._data = { type: 'list', title: data.title, cards: data.cards }; },
    cutList(data)  { this._data = { type: 'list', title: data.title, cards: data.cards }; },
    paste()        { return this._data; },
    clear()        { this._data = null; },
    isEmpty()      { return !this._data; },
    type()         { return this._data ? this._data.type : null; },
  };

  function selectCard(el) {
    if (_selCard) _selCard.classList.remove('card-selected');
    _selCard = el || null;
    if (_selCard) {
      _selCard.classList.add('card-selected');
      _selCard.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      const list = _selCard.closest('.list');
      if (list) selectList(list);
    }
  }

  function selectList(el) {
    if (_selList === el) return;
    if (_selList) _selList.classList.remove('list-selected');
    _selList = el || null;
    if (_selList) _selList.classList.add('list-selected');
  }

  function clearSelection() {
    selectCard(null);
    selectList(null);
  }

  function _firstCard(listEl) {
    const c = listEl && listEl.querySelector('.card');
    selectCard(c || null);
  }

  function prevCard() {
    if (!_selCard || !_selCard.isConnected) { _selCard = null; return; }
    const cards = [..._selCard.parentNode.querySelectorAll('.card')];
    const idx = cards.indexOf(_selCard);
    selectCard(cards[idx - 1] || cards[cards.length - 1]);
  }

  function nextCard() {
    if (!_selCard || !_selCard.isConnected) { _selCard = null; return; }
    const cards = [..._selCard.parentNode.querySelectorAll('.card')];
    const idx = cards.indexOf(_selCard);
    selectCard(cards[idx + 1] || cards[0]);
  }

  function prevList() {
    const lists = [...boardEl.querySelectorAll('.list')];
    if (!lists.length) return;
    if (_selList && _selList.isConnected) {
      selectList(lists[(lists.indexOf(_selList) - 1 + lists.length) % lists.length]);
    } else {
      selectList(lists[lists.length - 1]);
    }
    _firstCard(_selList);
  }

  function nextList() {
    const lists = [...boardEl.querySelectorAll('.list')];
    if (!lists.length) return;
    if (_selList && _selList.isConnected) {
      selectList(lists[(lists.indexOf(_selList) + 1) % lists.length]);
    } else {
      selectList(lists[0]);
    }
    _firstCard(_selList);
  }

  function newCardAtSel() {
    if (!_selList || !_selList.isConnected) return;
    const btn = _selList.querySelector('.btn-add-card');
    if (btn) btn.click();
  }

  function _newList() {
    const btn = boardEl.querySelector('.add-list-btn');
    if (btn) btn.click();
  }

  async function _doneCard() {
    if (!_selCard || !_selCard.isConnected) return;
    const card = _selCard;
    const doneList = [...boardEl.querySelectorAll('.list')].find(l => l.dataset.done === 'true');
    if (!doneList) return;
    const cardId    = card.dataset.id;
    const toListId  = doneList.dataset.id;
    const sourceListId = card.dataset.listId;
    if (sourceListId === toListId) return;
    const cardsEl   = doneList.querySelector('.cards');
    const newPos    = cardsEl.querySelectorAll('.card').length;
    await mutate(() => DB.moveCard(cardId, toListId, newPos));
    card.dataset.listId = toListId;
    cardsEl.appendChild(card);
    card.classList.add('card-done');
    const now = new Date().toISOString();
    await DB.setCardDoneAt(cardId, now);
    const atEl = card.querySelector('.card-done-at');
    if (atEl) atEl.textContent = formatDoneAt(now);
    updateStreak();
    pulseProgress();
    if (sourceListId !== toListId) await refreshCountBadge(sourceListId);
    await refreshCountBadge(toListId);
    await refreshHeaderInfo();
    selectCard(card);
  }

  async function cutCard() {
    if (!_selCard || !_selCard.isConnected) return;
    Clipboard.cutCard(extractCardData(_selCard));
    const listEl  = _selCard.closest('.list');
    const nextDom = _selCard.nextElementSibling || _selCard.previousElementSibling;
    await mutate(() => DB.deleteCard(_selCard.dataset.id));
    _selCard.remove();
    if (nextDom && nextDom.matches('.card')) selectCard(nextDom);
    else if (listEl) { selectList(listEl); _firstCard(listEl); }
    if (listEl) await refreshCountBadge(listEl.dataset.id);
    await refreshHeaderInfo();
  }

  function copyCard() {
    if (!_selCard || !_selCard.isConnected) return;
    Clipboard.copyCard(extractCardData(_selCard));
  }

  async function _paste() {
    if (Clipboard.isEmpty()) return;
    const data = Clipboard.paste();
    if (data.type === 'card') {
      if (!_selList || !_selList.isConnected) return;
      const listId = _selList.dataset.id;
      const done   = _selList.dataset.done === 'true';
      const card   = await mutate(async () => {
        const c = await DB.createCard(listId, data.text);
        if (data.notes) await DB.updateCardNotes(c.id, data.notes);
        return c;
      });
      const cardsEl = _selList.querySelector('.cards');
      const cardEl  = buildCard(card, done);
      cardsEl.appendChild(cardEl);
      selectCard(cardEl);
      await refreshCountBadge(listId);
      await refreshHeaderInfo();
    } else if (data.type === 'list') {
      const list = await mutate(() => DB.batch(async () => {
        const l = await DB.createList(data.title);
        if (_selList && _selList.isConnected) {
          const lists = [...boardEl.querySelectorAll('.list')];
          const idx   = lists.indexOf(_selList);
          await DB.reorderList(l.id, idx + 1);
        }
        for (const c of data.cards) {
          const card = await DB.createCard(l.id, c.text);
          if (c.notes) await DB.updateCardNotes(card.id, c.notes);
        }
        return l;
      }));
      const cards = await DB.getCards(list.id);
      const listEl = buildList(list, cards);
      if (_selList && _selList.isConnected) {
        _selList.after(listEl);
      } else {
        const addBtn = boardEl.querySelector('.add-list-btn');
        const widget = addBtn ? addBtn.parentNode : null;
        boardEl.insertBefore(listEl, widget);
      }
      selectList(listEl);
      _firstCard(listEl);
      await refreshCountBadge(list.id);
      await refreshHeaderInfo();
    }
  }

  async function cutList() {
    if (!_selList || !_selList.isConnected) return;
    Clipboard.cutList(extractListData(_selList));
    const id    = _selList.dataset.id;
    const lists = [...boardEl.querySelectorAll('.list')];
    const idx   = lists.indexOf(_selList);
    await mutate(() => DB.deleteList(id));
    _selList.remove();
    if (lists.length > 1) {
      const next = lists[idx + 1] || lists[idx - 1];
      if (next && next.isConnected) { selectList(next); _firstCard(next); }
    } else {
      clearSelection();
    }
    await refreshHeaderInfo();
  }

  function copyList() {
    if (!_selList || !_selList.isConnected) return;
    Clipboard.copyList(extractListData(_selList));
  }

  function toggleDoneList() {
    if (!_selList || !_selList.isConnected) return;
    const btn = _selList.querySelector('.btn-icon[title*="termin"]');

  function renameList() {

  function _inInput() {
    const ae = document.activeElement;
    return ae && ae.matches('input, textarea, select');
  }

  const BINDINGS = {};
  for (let n = 1; n <= 9; n++) {
    BINDINGS[String(n)] = { fn: (i => () => focusList(i))(n), when: () => !_inInput() };
  }
  Object.assign(BINDINGS, {
    h:      { fn: prevList,     when: () => !_inInput() },
    l:      { fn: nextList,     when: () => !_inInput() },
    j:      { fn: nextCard,     when: () => _selCard && _selCard.isConnected && !_inInput() },
    k:      { fn: prevCard,     when: () => _selCard && _selCard.isConnected && !_inInput() },
    n:      { fn: newCardAtSel, when: () => _selList && _selList.isConnected && !_inInput() },
    r:      { fn: _renameCard,  when: () => _selCard && _selCard.isConnected && !_inInput() },
    d:      { fn: _doneCard,    when: () => _selCard && _selCard.isConnected && !_inInput() },
    e:      { fn: _openNotes,   when: () => _selCard && _selCard.isConnected && !_inInput() },
    x:      { fn: cutCard,      when: () => _selCard && _selCard.isConnected && !_inInput() },
    y:      { fn: copyCard,     when: () => _selCard && _selCard.isConnected && !_inInput() },
    u:      { fn: _undo,        when: () => _undoSize() && !_inInput() },
    p:      { fn: _paste,       when: () => _selList && _selList.isConnected && !Clipboard.isEmpty() && Clipboard.type() === 'card' && !_inInput() },
    N:      { fn: _newList,       when: () => !_inInput() },
    R:      { fn: renameList,     when: () => _selList && _selList.isConnected && !_inInput() },
    X:      { fn: cutList,        when: () => _selList && _selList.isConnected && !_inInput() },
    Y:      { fn: copyList,       when: () => _selList && _selList.isConnected && !_inInput() },
    P:      { fn: _paste,         when: () => !Clipboard.isEmpty() && !_inInput() },
    D:      { fn: toggleDoneList, when: () => _selList && _selList.isConnected && !_inInput() },
    Escape: { fn: () => {
      const cs = document.querySelector('.cheatsheet-overlay.open');
      if (cs) { cs.classList.remove('open'); return; }
      if (_selCard || _selList) clearSelection();
    }, when: () => !_inInput() },
  });

  document.addEventListener('keydown', e => {
    if ((e.key === 'y' || e.key === 'Y') && (e.ctrlKey || e.metaKey) && !_inInput()) {
      if (_redoSize()) { e.preventDefault(); _redo(); }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('.modal-overlay.open, .search-overlay.open')) return;
    const action = BINDINGS[e.key];
    if (action && action.when()) { e.preventDefault(); action.fn(); }
  });

  boardEl.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card) { selectCard(card); return; }
    const list = e.target.closest('.list');
    if (list) selectList(list);
  });

  // ── CHEATSHEET ───────────────────────────────────────────
  (() => {
    const overlay = make('div', 'cheatsheet-overlay');
    const box     = make('div', 'cheatsheet');

    function rows(section, pairs) {
      const frag = document.createDocumentFragment();
      const h3 = document.createElement('h3');
      h3.textContent = section;
      frag.appendChild(h3);
      for (const [keys, desc] of pairs) {
        const row    = make('div', 'row');
        const keysEl = make('span', 'keys');
        keys.forEach(k => {
          const kbd = document.createElement('kbd');
          kbd.textContent = k;
          keysEl.appendChild(kbd);
        });
        const descEl = make('span', 'desc');
        descEl.textContent = desc;
        row.append(keysEl, descEl);
        frag.appendChild(row);
      }
      return frag;
    }

    const cols = make('div', 'cols');
    const colA = make('div', 'col');

      [['j','k'], 'Nav. \u2193/\u2191 dans la liste'],

    const intro = make('div', 'cheatsheet-intro');
    const h3 = document.createElement('h3');
    h3.textContent = 'Kanban anti-procrastination';
    intro.appendChild(h3);
    for (const [action, desc] of [
      ['D\u00E9composer', 'une grosse t\u00E2che \u00E0 co\u00FBt \u00E9lev\u00E9 d\u2019entr\u00E9e est cass\u00E9e en micro-t\u00E2ches \u00E0 co\u00FBt d\u2019entr\u00E9e nul'],

      const row  = make('div', 'row');
      const keys = make('span', 'keys');
      const kbd  = document.createElement('kbd');
      kbd.textContent = action;
      keys.appendChild(kbd);
      const descEl = make('span', 'desc');
      descEl.textContent = desc;
      row.append(keys, descEl);
      intro.appendChild(row);
    }
    const shortcuts = make('div', 'cheatsheet-shortcuts');
    shortcuts.appendChild(cols);
    shortcuts.appendChild(rows('Autres', [
      [['u'],         'Annuler'],
      [['Ctrl','Y'],  'R\u00E9tablir'],
      [['Ctrl','K'],  'Rechercher une carte'],
      [['1','9'],     'Focus liste 1 \u00E0 9'],
      [['?'],         'Aide'],
      [['Esc'],       'D\u00E9s\u00E9lectionner'],
    ]));
    box.appendChild(shortcuts);

    box.appendChild(intro);

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function toggle() {
      overlay.classList.toggle('open');
    }

    overlay.addEventListener('click', e => {
      if (e.target === overlay) toggle();
    });

    BINDINGS['?'] = { fn: toggle, when: () => !_inInput() };
  })();

  // ── RECHERCHE ───────────────────────────────────────────
  (() => {
    const overlay = make('div', 'search-overlay');
    const box     = make('div', 'search-box');
    const input   = make('input', 'search-input');
    input.type = 'text';
    input.placeholder = 'Rechercher une carte\u2026';
    const results = make('div', 'search-results');
    box.append(input, results);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    let _activeIdx = -1;

    function fuzzy(text, query) {
      const t = text.toLowerCase();
      const q = query.toLowerCase();
      let qi = 0;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) qi++;
      }
      return qi === q.length;
    }

    function search(query) {
      results.innerHTML = '';
      _activeIdx = -1;
      const q = query.trim();
      if (!q) return;
      const matches = [];
      boardEl.querySelectorAll('.list').forEach(list => {
        const listTitleEl = list.querySelector('.list-title');
        const listTitle = listTitleEl ? listTitleEl.textContent : '';
        list.querySelectorAll('.card').forEach(card => {
          const textEl = card.querySelector('.card-text');
          const text = textEl ? textEl.textContent : '';
          const notes = card.querySelector('.card-notes')?.value || '';
          if (fuzzy(text, q) || fuzzy(notes, q) || fuzzy(listTitle, q)) {
            matches.push({ card, list, listTitle, text });
          }
        });
      });
      if (!matches.length) {
        results.innerHTML = '<div class="search-empty">Aucun r\u00E9sultat</div>';
        return;
      }
      matches.forEach((m, i) => {
        const row = make('div', 'search-result');
        row.dataset.idx = i;
        row.innerHTML = '<span class="search-result-text">' + esc(m.text) + '</span><span class="search-result-list">' + esc(m.listTitle) + '</span>';
        row.addEventListener('click', () => {
          if (m.list.classList.contains('collapsed')) {
            m.list.classList.remove('collapsed'); // synchrone : la carte devient visible immédiatement
            const colBtn = m.list.querySelector('.btn-icon[title*="Replier"]');
            if (colBtn) colBtn.click(); // persiste l'état de façon asynchrone
          }
          selectList(m.list); selectCard(m.card); close();
        });
        results.appendChild(row);
      });
    }

    function open() {
      overlay.classList.add('open');
      input.value = '';
      results.innerHTML = '';
      _activeIdx = -1;
      setTimeout(() => input.focus(), 50);
    }

    function close() {
      overlay.classList.remove('open');
      input.blur();
    }

    function activate(idx) {
      const rows = results.querySelectorAll('.search-result');
      rows.forEach(r => r.classList.remove('active'));
      if (rows[idx]) {
        rows[idx].classList.add('active');
        rows[idx].scrollIntoView({ block: 'nearest' });
      }
      _activeIdx = idx;
    }

    function selectActive() {
      const active = results.querySelector('.search-result.active');
      if (active) active.click();
    }

    overlay.addEventListener('click', e => {
      if (e.target === overlay) close();
    });

    input.addEventListener('input', () => search(input.value));
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); return; }
      if (e.key === 'Enter')  { selectActive(); return; }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const rows = results.querySelectorAll('.search-result');
        if (rows.length) activate(Math.min(_activeIdx + 1, rows.length - 1));
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        activate(Math.max(_activeIdx - 1, 0));
        return;
      }
    });

    document.addEventListener('keydown', e => {
      if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) {
        if (overlay.classList.contains('open')) { e.preventDefault(); close(); }
        else if (!_inInput())                    { e.preventDefault(); open(); }
      }
    }, true);
  })();

  // ── REBUILD ────────────────────────────────────────────────
  async function _rebuild() {
    const boardData = await DB.getBoard();
    boardNameInput.value = boardData.name;
    document.title = `KanbanJS \u00b7 ${boardData.name}`;

    boardEl.innerHTML = '';
    clearSelection();

    const lists = await DB.getLists();
    const allCards = await DB.getAllCards();
    for (const l of lists) {
      const listEl = buildList(l, allCards.filter(c => c.listId === l.id));
      boardEl.appendChild(listEl);
      await refreshCountBadge(l.id);
    }

    buildAddListWidget();
    await refreshHeaderInfo();

    const cfg = readAIConfig();
    const fab  = document.getElementById('decomposeFab');
    if (!cfg || !cfg.apiKey || !cfg.model) {
      fab.classList.add('fab-no-api');
      fab.textContent = '!';
      fab.title = 'API non configurée — Cliquez sur ⚙';
    } else {
      fab.classList.remove('fab-no-api');
      fab.textContent = '+';
      fab.title = 'Décomposer une tâche (IA)';
    }
  }

  // ── INIT ──────────────────────────────────────────────────
  async function init() {
    try {
      await _rebuild();
      document.getElementById('helpBtn').addEventListener('click', () => {
        document.querySelector('.cheatsheet-overlay').classList.toggle('open');
      });
    } catch (err) {
      console.error('KanbanJS init error:', err);
      boardEl.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-muted)">
        Erreur au chargement.
        <button class="btn btn-ghost" id="recoverBtn">Réinitialiser</button>
      </div>`;
      document.getElementById('recoverBtn').addEventListener('click', async () => {
        await DB.reset();
        await _rebuild();
      });
    }
  }

  return { init };
})();

App.init();
</script>
</body>
